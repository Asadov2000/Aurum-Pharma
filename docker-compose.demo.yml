# Permanent local showcase stack. Secrets are loaded from the gitignored
# .env.showcase.local file generated by scripts/start-showcase-demo.ps1.
# The stack is loopback-bound and must never be used for staging or production.
name: aurum-demo

x-backend-environment: &backend-environment
  ENVIRONMENT: development
  DEPLOYMENT_PROFILE: cloud
  AURUM_SHOWCASE_SEED: "1"
  DATABASE_URL_APP: "postgresql+asyncpg://aurum_app:${AURUM_DEMO_APP_PASSWORD:?AURUM_DEMO_APP_PASSWORD is required}@postgres:5432/aurum_demo"
  DATABASE_URL_SUPPORT: "postgresql+asyncpg://aurum_support:${AURUM_DEMO_SUPPORT_PASSWORD:?AURUM_DEMO_SUPPORT_PASSWORD is required}@postgres:5432/aurum_demo"
  REDIS_URL: "redis://:${AURUM_DEMO_REDIS_PASSWORD:?AURUM_DEMO_REDIS_PASSWORD is required}@redis:6379/0"
  JWT_SECRET: "${AURUM_DEMO_JWT_SECRET:?AURUM_DEMO_JWT_SECRET is required}"
  MFA_ENCRYPTION_KEY: "${AURUM_DEMO_MFA_ENCRYPTION_KEY:?AURUM_DEMO_MFA_ENCRYPTION_KEY is required}"
  CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
  REFRESH_COOKIE_SECURE: "false"
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: "${AURUM_DEMO_MINIO_ACCESS_KEY:?AURUM_DEMO_MINIO_ACCESS_KEY is required}"
  MINIO_SECRET_KEY: "${AURUM_DEMO_MINIO_SECRET_KEY:?AURUM_DEMO_MINIO_SECRET_KEY is required}"
  MINIO_BUCKET: aurum-demo
  MINIO_SECURE: "false"
  PYTHONPATH: /app
  LOG_LEVEL: INFO

x-backend-service: &backend-service
  image: aurum-pharma-demo-backend:local
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment: *backend-environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
  init: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    container_name: aurum-demo-postgres
    environment:
      POSTGRES_DB: aurum_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${AURUM_DEMO_POSTGRES_PASSWORD:?AURUM_DEMO_POSTGRES_PASSWORD is required}"
      AURUM_APP_PASSWORD: "${AURUM_DEMO_APP_PASSWORD:?AURUM_DEMO_APP_PASSWORD is required}"
      AURUM_SUPPORT_PASSWORD: "${AURUM_DEMO_SUPPORT_PASSWORD:?AURUM_DEMO_SUPPORT_PASSWORD is required}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aurum_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    container_name: aurum-demo-redis
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: "${AURUM_DEMO_REDIS_PASSWORD:?AURUM_DEMO_REDIS_PASSWORD is required}"
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: aurum-demo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${AURUM_DEMO_MINIO_ACCESS_KEY:?AURUM_DEMO_MINIO_ACCESS_KEY is required}"
      MINIO_ROOT_PASSWORD: "${AURUM_DEMO_MINIO_SECRET_KEY:?AURUM_DEMO_MINIO_SECRET_KEY is required}"
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    <<: *backend-service
    container_name: aurum-demo-backend
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8000/healthz | grep -q '\"status\":\"ok\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  celery-worker:
    <<: *backend-service
    container_name: aurum-demo-celery-worker
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - worker
      - --loglevel=warning
      - --concurrency=1
      - --prefetch-multiplier=1

  celery-beat:
    <<: *backend-service
    container_name: aurum-demo-celery-beat
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - beat
      - --loglevel=warning

  frontend:
    image: aurum-pharma-demo-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    container_name: aurum-demo-frontend
    volumes:
      - frontend-vite-cache:/app/node_modules/.vite
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    command: pnpm preview --host 0.0.0.0 --port 5173 --strictPort
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
    name: aurum-demo-postgres-data
  redis-data:
    name: aurum-demo-redis-data
  minio-data:
    name: aurum-demo-minio-data
  frontend-vite-cache:
    name: aurum-demo-frontend-vite-cache

networks:
  default:
    name: aurum-demo-network
