x-backend-environment: &backend-environment
  ENVIRONMENT: development
  DATABASE_URL_APP: postgresql+asyncpg://aurum_app:aurum_app_pw@postgres:5432/${AURUM_E2E_DATABASE:-aurum}
  DATABASE_URL_SUPPORT: postgresql+asyncpg://aurum_support:aurum_support_pw@postgres:5432/${AURUM_E2E_DATABASE:-aurum}
  REDIS_URL: redis://:aurum_redis_pw@redis:6379/0
  CELERY_BROKER_URL: redis://aurum_api:aurum_api_broker_pw@redis:6379/0
  JWT_SECRET: e2e-only-secret-do-not-use-outside-tests-123456
  AUTH_LOCAL_TESTING_MODE: "true"
  SMS_PROVIDER: development
  SMS_DAILY_LIMIT: "1000"
  CORS_ORIGINS: '["http://localhost:15173"]'
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: aurum
  MINIO_SECURE: "false"
  PYTHONPATH: /app

services:
  postgres:
    networks:
      - db
    image: postgres:16-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    environment:
      POSTGRES_DB: ${AURUM_E2E_DATABASE:-aurum}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      AURUM_APP_PASSWORD: aurum_app_pw
      AURUM_SUPPORT_PASSWORD: aurum_support_pw
      AURUM_MAILER_PASSWORD: aurum_mailer_pw
      AURUM_BILLING_WORKER_PASSWORD: aurum_billing_worker_pw
      AURUM_WORKER_PASSWORD: aurum_worker_pw
      AURUM_CATALOG_WORKER_PASSWORD: aurum_catalog_worker_pw
      AURUM_MIGRATOR_PASSWORD: aurum_migrator_pw
      AURUM_BACKUP_PASSWORD: aurum_backup_pw
      AURUM_PITR_PASSWORD: aurum_pitr_pw
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./infra/postgres/role-contract.sql:/docker-entrypoint-initdb.d/role-contract.inc:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d ${AURUM_E2E_DATABASE:-aurum}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: "no"

  redis:
    networks:
      - broker
    tmpfs:
      - /tmp:size=8m,mode=1777
    volumes:
      - ./infra/redis/start-with-worker-acl.sh:/config/start-with-worker-acl.sh:ro
    environment:
      REDIS_TLS: "false"
      AURUM_REDIS_MAXMEMORY: "0"
      REDIS_PASSWORD: aurum_redis_pw
      REDIS_APPENDONLY: "no"
      REDIS_CELERY_API_PASSWORD: aurum_api_broker_pw
      REDIS_CELERY_BEAT_PASSWORD: aurum_beat_broker_pw
      REDIS_CELERY_SYSTEM_PASSWORD: aurum_system_broker_pw
      REDIS_CELERY_CATALOG_PASSWORD: aurum_catalog_broker_pw
      REDIS_CELERY_BILLING_PASSWORD: aurum_billing_broker_pw
      REDIS_CELERY_MAILER_PASSWORD: aurum_mailer_broker_pw
    entrypoint: ["/bin/sh", "/config/start-with-worker-acl.sh"]
    image: redis:7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

  mailpit:
    networks:
      - mailer-egress
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    environment:
      MP_MAX_MESSAGES: 200
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

  minio:
    networks:
      - storage
    image: quay.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: "no"

  db-role-bootstrap:
    networks:
      - db
    image: postgres:16-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${AURUM_E2E_DATABASE:-aurum}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      AURUM_APP_PASSWORD: aurum_app_pw
      AURUM_SUPPORT_PASSWORD: aurum_support_pw
      AURUM_MAILER_PASSWORD: aurum_mailer_pw
      AURUM_BILLING_WORKER_PASSWORD: aurum_billing_worker_pw
      AURUM_WORKER_PASSWORD: aurum_worker_pw
      AURUM_CATALOG_WORKER_PASSWORD: aurum_catalog_worker_pw
      AURUM_MIGRATOR_PASSWORD: aurum_migrator_pw
      AURUM_BACKUP_PASSWORD: aurum_backup_pw
      AURUM_PITR_PASSWORD: aurum_pitr_pw
    volumes:
      - ./infra/postgres:/opt/aurum/postgres:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "/opt/aurum/postgres/bootstrap-roles.sh"]
    restart: "no"

  migrate:
    networks:
      - db
    image: aurum-pharma-e2e-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL_SUPPORT: postgresql+asyncpg://aurum_support:aurum_support_pw@postgres:5432/${AURUM_E2E_DATABASE:-aurum}
      DATABASE_URL_MIGRATION: postgresql+asyncpg://aurum_migrator:aurum_migrator_pw@postgres:5432/${AURUM_E2E_DATABASE:-aurum}
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m app.migrate upgrade head
    restart: "no"

  backend:
    networks:
      - web
      - db
      - broker
      - storage
    image: aurum-pharma-e2e-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-environment
    ports:
      - "18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: "no"

  celery-worker:
    networks:
      - db
      - broker
    healthcheck:
      test: ["CMD", "python", "-m", "app.tasks.worker_health", "system", "/tmp/celery-worker.pid"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    image: aurum-pharma-e2e-backend:local
    environment:
      ENVIRONMENT: development
      DATABASE_URL_WORKER: postgresql+asyncpg://aurum_worker:aurum_worker_pw@postgres:5432/${AURUM_E2E_DATABASE:-aurum}
      CELERY_BROKER_URL: redis://aurum_system:aurum_system_broker_pw@redis:6379/0
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=warning -Q default --without-gossip --without-mingle --without-heartbeat --pidfile=/tmp/celery-worker.pid
    restart: "no"

  catalog-minio-init:
    networks:
      - storage
    image: quay.io/minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: ["/bin/sh", "/config/provision-catalog-reader.sh"]
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      MINIO_BUCKET: aurum
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ACCESS_KEY: minioadmin
      CATALOG_MINIO_ACCESS_KEY: aurum_catalog_reader
      CATALOG_MINIO_SECRET_KEY: aurum_catalog_reader_pw
    volumes:
      - ./infra/minio/provision-catalog-reader.sh:/config/provision-catalog-reader.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  catalog-worker:
    networks:
      - db
      - broker
      - storage
    healthcheck:
      test: ["CMD", "python", "-m", "app.tasks.worker_health", "catalog", "/tmp/celery-worker.pid"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    image: aurum-pharma-e2e-backend:local
    environment:
      ENVIRONMENT: development
      DATABASE_URL_CATALOG_WORKER: postgresql+asyncpg://aurum_catalog_worker:aurum_catalog_worker_pw@postgres:5432/${AURUM_E2E_DATABASE:-aurum}
      CELERY_BROKER_URL: redis://aurum_catalog:aurum_catalog_broker_pw@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      CATALOG_MINIO_ACCESS_KEY: aurum_catalog_reader
      CATALOG_MINIO_SECRET_KEY: aurum_catalog_reader_pw
      MINIO_BUCKET: aurum
      MINIO_SECURE: "false"
      PYTHONPATH: /app
    depends_on:
      catalog-minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: celery -A app.tasks.catalog_app worker --loglevel=warning -Q catalog-worker --concurrency=1 --without-gossip --without-mingle --without-heartbeat --pidfile=/tmp/celery-worker.pid
    restart: "no"

  billing-worker:
    networks:
      - db
      - broker
    healthcheck:
      test: ["CMD", "python", "-m", "app.tasks.worker_health", "billing", "/tmp/celery-worker.pid"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    image: aurum-pharma-e2e-backend:local
    environment:
      ENVIRONMENT: development
      DATABASE_URL_BILLING_WORKER: postgresql+asyncpg://aurum_billing_worker:aurum_billing_worker_pw@postgres:5432/${AURUM_E2E_DATABASE:-aurum}
      CELERY_BROKER_URL: redis://aurum_billing:aurum_billing_broker_pw@redis:6379/0
      BILLING_TRANSITION_BATCH_SIZE: "100"
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.billing_app worker --loglevel=warning -Q billing-worker --concurrency=1 --without-gossip --without-mingle --without-heartbeat --pidfile=/tmp/celery-worker.pid
    restart: "no"

  platform-mailer:
    networks:
      - db
      - broker
      - mailer-egress
    healthcheck:
      test: ["CMD", "python", "-m", "app.tasks.worker_health", "mailer", "/tmp/celery-worker.pid"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    image: aurum-pharma-e2e-backend:local
    environment:
      ENVIRONMENT: development
      DATABASE_URL_MAILER: postgresql+asyncpg://aurum_mailer:aurum_mailer_pw@postgres:5432/${AURUM_E2E_DATABASE:-aurum}
      CELERY_BROKER_URL: redis://aurum_mailer:aurum_mailer_broker_pw@redis:6379/0
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USER: ""
      EMAIL_PASSWORD: ""
      EMAIL_FROM: no-reply@aurum-pharma.local
      EMAIL_USE_TLS: "false"
      PUBLIC_APP_URL: http://localhost:15173
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    command: celery -A app.tasks.mailer_app worker --loglevel=warning -Q platform-mailer --concurrency=1 --without-gossip --without-mingle --without-heartbeat --pidfile=/tmp/celery-worker.pid
    restart: "no"

  celery-beat:
    image: aurum-pharma-e2e-backend:local
    environment:
      ENVIRONMENT: development
      CELERY_BROKER_URL: redis://aurum_beat:aurum_beat_broker_pw@redis:6379/0
      PYTHONPATH: /app
    networks:
      - broker
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.tasks.beat_app beat --loglevel=warning --schedule=/tmp/celerybeat-schedule
    restart: "no"

  frontend:
    networks:
      - web
    image: aurum-pharma-e2e-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:18000/api/v1
    ports:
      - "15173:5173"
    command: pnpm preview --host 0.0.0.0 --port 5173
    restart: "no"

volumes:
  postgres-data:
  minio-data:

networks:
  web:
  db:
    internal: true
  broker:
    internal: true
  storage:
    internal: true
  mailer-egress:
