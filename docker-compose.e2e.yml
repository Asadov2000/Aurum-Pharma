x-backend-environment: &backend-environment
  ENVIRONMENT: development
  DATABASE_URL_APP: postgresql+asyncpg://aurum_app:aurum_app_pw@postgres:5432/${AURUM_E2E_DATABASE:-aurum}
  DATABASE_URL_SUPPORT: postgresql+asyncpg://aurum_support:aurum_support_pw@postgres:5432/${AURUM_E2E_DATABASE:-aurum}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: e2e-only-secret-do-not-use-outside-tests-123456
  CORS_ORIGINS: '["http://localhost:15173"]'
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: aurum
  MINIO_SECURE: "false"
  PYTHONPATH: /app

services:
  postgres:
    image: postgres:16-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    environment:
      POSTGRES_DB: ${AURUM_E2E_DATABASE:-aurum}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      AURUM_APP_PASSWORD: aurum_app_pw
      AURUM_SUPPORT_PASSWORD: aurum_support_pw
      AURUM_MIGRATOR_PASSWORD: aurum_migrator_pw
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./infra/postgres/role-contract.sql:/docker-entrypoint-initdb.d/role-contract.inc:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d ${AURUM_E2E_DATABASE:-aurum}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: "no"

  redis:
    image: redis:7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    command: redis-server --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: "no"

  db-role-bootstrap:
    image: postgres:16-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${AURUM_E2E_DATABASE:-aurum}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      AURUM_APP_PASSWORD: aurum_app_pw
      AURUM_SUPPORT_PASSWORD: aurum_support_pw
      AURUM_MIGRATOR_PASSWORD: aurum_migrator_pw
    volumes:
      - ./infra/postgres:/opt/aurum/postgres:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "/opt/aurum/postgres/bootstrap-roles.sh"]
    restart: "no"

  migrate:
    image: aurum-pharma-e2e-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL_SUPPORT: postgresql+asyncpg://aurum_support:aurum_support_pw@postgres:5432/${AURUM_E2E_DATABASE:-aurum}
      DATABASE_URL_MIGRATION: postgresql+asyncpg://aurum_migrator:aurum_migrator_pw@postgres:5432/${AURUM_E2E_DATABASE:-aurum}
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m app.migrate upgrade head
    restart: "no"

  backend:
    image: aurum-pharma-e2e-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-environment
    ports:
      - "18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: "no"

  celery-worker:
    image: aurum-pharma-e2e-backend:local
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=warning
    restart: "no"

  frontend:
    image: aurum-pharma-e2e-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:18000/api/v1
    ports:
      - "15173:5173"
    command: pnpm preview --host 0.0.0.0 --port 5173
    restart: "no"

volumes:
  postgres-data:
  minio-data:
