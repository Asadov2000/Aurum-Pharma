# Manual encrypted backup and isolated restore drill. Always combine this file
# with docker-compose.production.yml. No recovery service publishes host ports.
services:
  minio-backup-init:
    profiles: ["backup"]
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        root_user="$$(cat /run/secrets/MINIO_ROOT_USER)"
        root_password="$$(cat /run/secrets/MINIO_ROOT_PASSWORD)"
        backup_user="$$(cat /run/secrets/MINIO_BACKUP_ACCESS_KEY)"
        backup_password="$$(cat /run/secrets/MINIO_BACKUP_SECRET_KEY)"
        mc --config-dir /tmp/.mc alias set local http://minio:9000 "$$root_user" "$$root_password"
        mc --config-dir /tmp/.mc admin user add local "$$backup_user" "$$backup_password"
        mc --config-dir /tmp/.mc admin policy create local aurum-backup /config/aurum-backup-policy.json
        mc --config-dir /tmp/.mc admin policy attach local aurum-backup --user "$$backup_user"
    secrets:
      - source: minio_root_user
        target: MINIO_ROOT_USER
      - source: minio_root_password
        target: MINIO_ROOT_PASSWORD
      - source: minio_backup_access_key
        target: MINIO_BACKUP_ACCESS_KEY
      - source: minio_backup_secret_key
        target: MINIO_BACKUP_SECRET_KEY
    volumes:
      - ./infra/minio/aurum-backup-policy.json:/config/aurum-backup-policy.json:ro
    networks:
      - data
    depends_on:
      minio-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: "0.25"
    restart: "no"

  backup:
    profiles: ["backup"]
    image: aurum-pharma-backup:${AURUM_IMAGE_TAG:-local}
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    environment:
      AURUM_BACKUP_MIN_FREE_BYTES: "${AURUM_BACKUP_MIN_FREE_BYTES:-5368709120}"
    secrets:
      - source: database_url_backup
        target: DATABASE_URL_BACKUP
      - source: minio_backup_access_key
        target: MINIO_BACKUP_ACCESS_KEY
      - source: minio_backup_secret_key
        target: MINIO_BACKUP_SECRET_KEY
      - source: restic_password
        target: RESTIC_PASSWORD
    volumes:
      - type: bind
        source: "${AURUM_BACKUP_REPOSITORY:?AURUM_BACKUP_REPOSITORY is required}"
        target: /repository
      - type: bind
        source: "${AURUM_BACKUP_SCRATCH:?AURUM_BACKUP_SCRATCH is required}"
        target: /scratch
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
      minio-backup-init:
        condition: service_completed_successfully
    command: ["/bin/sh", "/opt/aurum/backup.sh"]
    read_only: true
    tmpfs:
      - /workspace:size=64m,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: "${AURUM_BACKUP_MEMORY_LIMIT:-768m}"
    cpus: "${AURUM_BACKUP_CPU_LIMIT:-1.0}"
    restart: "no"

  pitr-basebackup:
    profiles: ["backup"]
    image: aurum-pharma-backup:${AURUM_IMAGE_TAG:-local}
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    environment:
      AURUM_BACKUP_MIN_FREE_BYTES: "${AURUM_BACKUP_MIN_FREE_BYTES:-5368709120}"
    secrets:
      - source: database_url_pitr
        target: DATABASE_URL_PITR
      - source: restic_password
        target: RESTIC_PASSWORD
    volumes:
      - type: bind
        source: "${AURUM_BACKUP_REPOSITORY:?AURUM_BACKUP_REPOSITORY is required}"
        target: /repository
      - type: bind
        source: "${AURUM_BACKUP_SCRATCH:?AURUM_BACKUP_SCRATCH is required}"
        target: /scratch
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/bin/sh", "/opt/aurum/pitr-basebackup.sh"]
    read_only: true
    tmpfs:
      - /workspace:size=64m,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: "${AURUM_BACKUP_MEMORY_LIMIT:-768m}"
    cpus: "${AURUM_BACKUP_CPU_LIMIT:-1.0}"
    restart: "no"

  wal-snapshot:
    profiles: ["backup"]
    image: aurum-pharma-backup:${AURUM_IMAGE_TAG:-local}
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    secrets:
      - source: restic_password
        target: RESTIC_PASSWORD
    volumes:
      - type: bind
        source: "${AURUM_BACKUP_REPOSITORY:?AURUM_BACKUP_REPOSITORY is required}"
        target: /repository
      - type: bind
        source: "${AURUM_WAL_ARCHIVE:?AURUM_WAL_ARCHIVE is required}"
        target: /wal-archive
        read_only: true
    command: ["/bin/sh", "/opt/aurum/wal-snapshot.sh"]
    group_add:
      - "70"
    read_only: true
    tmpfs:
      - /workspace:size=64m,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: "${AURUM_BACKUP_MEMORY_LIMIT:-768m}"
    cpus: "${AURUM_BACKUP_CPU_LIMIT:-1.0}"
    restart: "no"

  offsite-sync:
    profiles: ["offsite"]
    image: aurum-pharma-backup:${AURUM_IMAGE_TAG:-local}
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    environment:
      AURUM_OFFSITE_ENDPOINT: "${AURUM_OFFSITE_ENDPOINT:?AURUM_OFFSITE_ENDPOINT is required}"
      AURUM_OFFSITE_BUCKET: "${AURUM_OFFSITE_BUCKET:?AURUM_OFFSITE_BUCKET is required}"
      AURUM_OFFSITE_PREFIX: "${AURUM_OFFSITE_PREFIX:-aurum-production}"
      AURUM_OFFSITE_ALLOW_INSECURE: "${AURUM_OFFSITE_ALLOW_INSECURE:-false}"
      AURUM_OFFSITE_CANDIDATE_DIR: /candidate
    secrets:
      - source: aurum_offsite_access_key
        target: AURUM_OFFSITE_ACCESS_KEY
      - source: aurum_offsite_secret_key
        target: AURUM_OFFSITE_SECRET_KEY
    volumes:
      - type: bind
        source: "${AURUM_BACKUP_REPOSITORY:?AURUM_BACKUP_REPOSITORY is required}"
        target: /repository
        read_only: true
      - type: bind
        source: "${AURUM_OFFSITE_CANDIDATE_DIR:?AURUM_OFFSITE_CANDIDATE_DIR is required}"
        target: /candidate
    networks:
      - backup-egress
    command: ["/bin/sh", "/opt/aurum/offsite-sync.sh"]
    read_only: true
    tmpfs:
      - /workspace:size=128m,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: "${AURUM_BACKUP_MEMORY_LIMIT:-768m}"
    cpus: "${AURUM_BACKUP_CPU_LIMIT:-1.0}"
    restart: "no"

  offsite-test-minio:
    profiles: ["offsite-test"]
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_BROWSER: "off"
      MINIO_ROOT_USER_FILE: /run/secrets/MINIO_ROOT_USER
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/MINIO_ROOT_PASSWORD
    secrets:
      - source: minio_root_user
        target: MINIO_ROOT_USER
      - source: minio_root_password
        target: MINIO_ROOT_PASSWORD
    volumes:
      - offsite-test-data:/data
    networks:
      - backup-egress
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "0.5"
    restart: "no"

  offsite-test-init:
    profiles: ["offsite-test"]
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        root_user="$$(cat /run/secrets/MINIO_ROOT_USER)"
        root_password="$$(cat /run/secrets/MINIO_ROOT_PASSWORD)"
        append_user="$$(cat /run/secrets/AURUM_OFFSITE_ACCESS_KEY)"
        append_password="$$(cat /run/secrets/AURUM_OFFSITE_SECRET_KEY)"
        restore_user="$$(cat /run/secrets/AURUM_OFFSITE_RESTORE_ACCESS_KEY)"
        restore_password="$$(cat /run/secrets/AURUM_OFFSITE_RESTORE_SECRET_KEY)"
        mc --config-dir /tmp/.mc alias set test http://offsite-test-minio:9000 "$$root_user" "$$root_password"
        mc --config-dir /tmp/.mc mb --with-lock --ignore-existing test/aurum-offsite-test
        mc --config-dir /tmp/.mc version enable test/aurum-offsite-test
        mc --config-dir /tmp/.mc retention set --default COMPLIANCE 30d test/aurum-offsite-test
        mc --config-dir /tmp/.mc admin user add test "$$append_user" "$$append_password"
        mc --config-dir /tmp/.mc admin policy create test aurum-offsite-append /config/policy.json
        mc --config-dir /tmp/.mc admin policy attach test aurum-offsite-append --user "$$append_user"
        mc --config-dir /tmp/.mc admin user add test "$$restore_user" "$$restore_password"
        mc --config-dir /tmp/.mc admin policy create test aurum-offsite-restore /config/restore-policy.json
        mc --config-dir /tmp/.mc admin policy attach test aurum-offsite-restore --user "$$restore_user"
    secrets:
      - source: minio_root_user
        target: MINIO_ROOT_USER
      - source: minio_root_password
        target: MINIO_ROOT_PASSWORD
      - source: aurum_offsite_access_key
        target: AURUM_OFFSITE_ACCESS_KEY
      - source: aurum_offsite_secret_key
        target: AURUM_OFFSITE_SECRET_KEY
      - source: aurum_offsite_restore_access_key
        target: AURUM_OFFSITE_RESTORE_ACCESS_KEY
      - source: aurum_offsite_restore_secret_key
        target: AURUM_OFFSITE_RESTORE_SECRET_KEY
    volumes:
      - ./infra/minio/aurum-offsite-append-policy.json:/config/policy.json:ro
      - ./infra/minio/aurum-offsite-restore-policy.json:/config/restore-policy.json:ro
    networks:
      - backup-egress
    depends_on:
      offsite-test-minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: "0.25"
    restart: "no"

  offsite-test-approve:
    profiles: ["offsite-test"]
    image: aurum-pharma-backup:${AURUM_IMAGE_TAG:-local}
    environment:
      AURUM_OFFSITE_EXPORT_ID: "${AURUM_OFFSITE_EXPORT_ID:-explicit-export-id-required}"
      AURUM_OFFSITE_BUCKET: "${AURUM_OFFSITE_BUCKET:?AURUM_OFFSITE_BUCKET is required}"
      AURUM_OFFSITE_PREFIX: "${AURUM_OFFSITE_PREFIX:-aurum-production}"
    secrets:
      - source: minio_root_user
        target: MINIO_ROOT_USER
      - source: minio_root_password
        target: MINIO_ROOT_PASSWORD
    volumes:
      - type: bind
        source: "${AURUM_OFFSITE_APPROVAL_DIR:?AURUM_OFFSITE_APPROVAL_DIR is required}"
        target: /approval
    networks:
      - backup-egress
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export_id="$$AURUM_OFFSITE_EXPORT_ID"
        manifest_key="$$AURUM_OFFSITE_PREFIX/manifests/$$export_id.json"
        root_user="$$(cat /run/secrets/MINIO_ROOT_USER)"
        root_password="$$(cat /run/secrets/MINIO_ROOT_PASSWORD)"
        mc --config-dir /workspace/mc alias set provider \
          http://offsite-test-minio:9000 "$$root_user" "$$root_password" >/dev/null
        version_id="$$(mc --json --config-dir /workspace/mc stat \
          "provider/$$AURUM_OFFSITE_BUCKET/$$manifest_key" | \
          jq -er 'select(.status == "success") | .versionID // .versionId')"
        mc --config-dir /workspace/mc cp --version-id "$$version_id" \
          "provider/$$AURUM_OFFSITE_BUCKET/$$manifest_key" \
          /workspace/manifest.json >/dev/null
        manifest_sha256="$$(sha256sum /workspace/manifest.json | awk '{print $$1}')"
        jq -S -n \
          --arg export_id "$$export_id" \
          --arg manifest_key "$$manifest_key" \
          --arg manifest_version_id "$$version_id" \
          --arg manifest_sha256 "$$manifest_sha256" \
          '{schema_version: 1, export_id: $$export_id, manifest_key: $$manifest_key,
            manifest_version_id: $$manifest_version_id,
            manifest_sha256: $$manifest_sha256}' \
          > "/approval/$$export_id.approval.json"
    read_only: true
    tmpfs:
      - /workspace:size=16m,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 32
    mem_limit: 64m
    cpus: "0.25"
    restart: "no"

  offsite-trust-verify:
    profiles: ["offsite-trust-verify", "offsite-test"]
    image: aurum-pharma-backup:${AURUM_IMAGE_TAG:-local}
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    environment:
      AURUM_OFFSITE_ENDPOINT: "${AURUM_OFFSITE_ENDPOINT:?AURUM_OFFSITE_ENDPOINT is required}"
      AURUM_OFFSITE_BUCKET: "${AURUM_OFFSITE_BUCKET:?AURUM_OFFSITE_BUCKET is required}"
      AURUM_OFFSITE_PREFIX: "${AURUM_OFFSITE_PREFIX:-aurum-production}"
      AURUM_OFFSITE_ALLOW_INSECURE: "${AURUM_OFFSITE_ALLOW_INSECURE:-false}"
      AURUM_OFFSITE_EXPORT_ID: "${AURUM_OFFSITE_EXPORT_ID:-explicit-export-id-required}"
      AURUM_OFFSITE_APPROVAL_DIR: /approval
      AURUM_VERIFIED_CHECKPOINT_DIR: /verified
    secrets:
      - source: aurum_offsite_restore_access_key
        target: AURUM_OFFSITE_RESTORE_ACCESS_KEY
      - source: aurum_offsite_restore_secret_key
        target: AURUM_OFFSITE_RESTORE_SECRET_KEY
      - source: restic_password
        target: RESTIC_PASSWORD
      - source: aurum_recovery_signing_public_key
        target: AURUM_RECOVERY_SIGNING_PUBLIC_KEY
    volumes:
      - type: bind
        source: "${AURUM_BACKUP_SCRATCH:?AURUM_BACKUP_SCRATCH is required}"
        target: /scratch
      - type: bind
        source: "${AURUM_OFFSITE_APPROVAL_DIR:?AURUM_OFFSITE_APPROVAL_DIR is required}"
        target: /approval
        read_only: true
      - type: bind
        source: "${AURUM_VERIFIED_CHECKPOINT_DIR:?AURUM_VERIFIED_CHECKPOINT_DIR is required}"
        target: /verified
    networks:
      - backup-egress
    command: ["/bin/sh", "/opt/aurum/offsite-trust-verify.sh"]
    read_only: true
    tmpfs:
      - /workspace:size=64m,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: "${AURUM_BACKUP_MEMORY_LIMIT:-768m}"
    cpus: "${AURUM_BACKUP_CPU_LIMIT:-1.0}"
    restart: "no"

  offsite-trust-sign:
    profiles: ["offsite-trust-sign", "offsite-test"]
    image: aurum-pharma-backup:${AURUM_IMAGE_TAG:-local}
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    environment:
      AURUM_OFFSITE_EXPORT_ID: "${AURUM_OFFSITE_EXPORT_ID:-explicit-export-id-required}"
      AURUM_VERIFIED_CHECKPOINT_DIR: /verified
      AURUM_SIGNING_AUTHORIZATION_DIR: /authorization
      AURUM_TRUSTED_CHECKPOINT_DIR: /trusted
    secrets:
      - source: aurum_recovery_signing_private_key
        target: AURUM_RECOVERY_SIGNING_PRIVATE_KEY
    volumes:
      - type: bind
        source: "${AURUM_VERIFIED_CHECKPOINT_DIR:?AURUM_VERIFIED_CHECKPOINT_DIR is required}"
        target: /verified
        read_only: true
      - type: bind
        source: "${AURUM_SIGNING_AUTHORIZATION_DIR:?AURUM_SIGNING_AUTHORIZATION_DIR is required}"
        target: /authorization
        read_only: true
      - type: bind
        source: "${AURUM_TRUSTED_CHECKPOINT_DIR:?AURUM_TRUSTED_CHECKPOINT_DIR is required}"
        target: /trusted
    network_mode: none
    command: ["/bin/sh", "/opt/aurum/offsite-trust-sign.sh"]
    read_only: true
    tmpfs:
      - /workspace:size=16m,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 32
    mem_limit: 64m
    cpus: "0.25"
    restart: "no"

  offsite-trusted-restore:
    profiles: ["offsite-restore", "offsite-test"]
    image: aurum-pharma-backup:${AURUM_IMAGE_TAG:-local}
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    environment:
      AURUM_OFFSITE_ENDPOINT: "${AURUM_OFFSITE_ENDPOINT:?AURUM_OFFSITE_ENDPOINT is required}"
      AURUM_OFFSITE_BUCKET: "${AURUM_OFFSITE_BUCKET:?AURUM_OFFSITE_BUCKET is required}"
      AURUM_OFFSITE_PREFIX: "${AURUM_OFFSITE_PREFIX:-aurum-production}"
      AURUM_OFFSITE_ALLOW_INSECURE: "${AURUM_OFFSITE_ALLOW_INSECURE:-false}"
      AURUM_OFFSITE_EXPORT_ID: "${AURUM_OFFSITE_EXPORT_ID:-explicit-export-id-required}"
      AURUM_TRUSTED_CHECKPOINT_DIR: /trusted
    secrets:
      - source: aurum_offsite_restore_access_key
        target: AURUM_OFFSITE_RESTORE_ACCESS_KEY
      - source: aurum_offsite_restore_secret_key
        target: AURUM_OFFSITE_RESTORE_SECRET_KEY
      - source: restic_password
        target: RESTIC_PASSWORD
      - source: aurum_recovery_signing_public_key
        target: AURUM_RECOVERY_SIGNING_PUBLIC_KEY
    volumes:
      - type: bind
        source: "${AURUM_BACKUP_SCRATCH:?AURUM_BACKUP_SCRATCH is required}"
        target: /scratch
      - type: bind
        source: "${AURUM_TRUSTED_CHECKPOINT_DIR:?AURUM_TRUSTED_CHECKPOINT_DIR is required}"
        target: /trusted
        read_only: true
    networks:
      - backup-egress
    command: ["/bin/sh", "/opt/aurum/offsite-trusted-restore.sh"]
    read_only: true
    tmpfs:
      - /workspace:size=64m,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: "${AURUM_BACKUP_MEMORY_LIMIT:-768m}"
    cpus: "${AURUM_BACKUP_CPU_LIMIT:-1.0}"
    restart: "no"

  restore-postgres:
    profiles: ["restore-drill"]
    image: postgres:16-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    environment:
      POSTGRES_DB: aurum_restore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      AURUM_APP_PASSWORD_FILE: /run/secrets/AURUM_APP_PASSWORD
      AURUM_SUPPORT_PASSWORD_FILE: /run/secrets/AURUM_SUPPORT_PASSWORD
      AURUM_MIGRATOR_PASSWORD_FILE: /run/secrets/AURUM_MIGRATOR_PASSWORD
      AURUM_MAILER_PASSWORD_FILE: /run/secrets/AURUM_MAILER_PASSWORD
      AURUM_BILLING_WORKER_PASSWORD_FILE: /run/secrets/AURUM_BILLING_WORKER_PASSWORD
      AURUM_BACKUP_PASSWORD_FILE: /run/secrets/AURUM_BACKUP_PASSWORD
      AURUM_PITR_PASSWORD_FILE: /run/secrets/AURUM_PITR_PASSWORD
    secrets:
      - source: postgres_password
        target: POSTGRES_PASSWORD
      - source: aurum_app_password
        target: AURUM_APP_PASSWORD
      - source: aurum_support_password
        target: AURUM_SUPPORT_PASSWORD
      - source: aurum_migrator_password
        target: AURUM_MIGRATOR_PASSWORD
      - source: aurum_mailer_password
        target: AURUM_MAILER_PASSWORD
      - source: aurum_billing_worker_password
        target: AURUM_BILLING_WORKER_PASSWORD
      - source: aurum_backup_password
        target: AURUM_BACKUP_PASSWORD
      - source: aurum_pitr_password
        target: AURUM_PITR_PASSWORD
    volumes:
      - restore-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./infra/postgres/role-contract.sql:/docker-entrypoint-initdb.d/role-contract.inc:ro
    networks:
      - recovery
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          psql -U postgres -d aurum_restore -tAc
          "SELECT 1 WHERE EXISTS (
          SELECT FROM pg_roles WHERE rolname = 'aurum_backup'
          ) AND has_function_privilege(
          'aurum_app', to_regprocedure('public.similarity_op(text,text)'), 'EXECUTE'
          )" | grep -qx 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: "1.0"
    restart: "no"

  restore-minio:
    profiles: ["restore-drill"]
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_BROWSER: "off"
      MINIO_ROOT_USER_FILE: /run/secrets/MINIO_ROOT_USER
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/MINIO_ROOT_PASSWORD
    secrets:
      - source: minio_root_user
        target: MINIO_ROOT_USER
      - source: minio_root_password
        target: MINIO_ROOT_PASSWORD
    volumes:
      - restore-minio-data:/data
    networks:
      - recovery
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "0.5"
    restart: "no"

  restore-drill:
    profiles: ["restore-drill"]
    image: aurum-pharma-backup:${AURUM_IMAGE_TAG:-local}
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    environment:
      AURUM_BACKUP_MIN_FREE_BYTES: "${AURUM_BACKUP_MIN_FREE_BYTES:-5368709120}"
    secrets:
      - source: postgres_password
        target: POSTGRES_PASSWORD
      - source: aurum_app_password
        target: AURUM_APP_PASSWORD
      - source: aurum_support_password
        target: AURUM_SUPPORT_PASSWORD
      - source: aurum_backup_password
        target: AURUM_BACKUP_PASSWORD
      - source: minio_root_user
        target: MINIO_ROOT_USER
      - source: minio_root_password
        target: MINIO_ROOT_PASSWORD
      - source: restic_password
        target: RESTIC_PASSWORD
    volumes:
      - type: bind
        source: "${AURUM_BACKUP_REPOSITORY:?AURUM_BACKUP_REPOSITORY is required}"
        target: /repository
        read_only: true
      - type: bind
        source: "${AURUM_BACKUP_SCRATCH:?AURUM_BACKUP_SCRATCH is required}"
        target: /scratch
    networks:
      - recovery
    depends_on:
      restore-postgres:
        condition: service_healthy
      restore-minio:
        condition: service_healthy
    command: ["/bin/sh", "/opt/aurum/restore-drill.sh"]
    read_only: true
    tmpfs:
      - /workspace:size=64m,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: "${AURUM_BACKUP_MEMORY_LIMIT:-768m}"
    cpus: "${AURUM_BACKUP_CPU_LIMIT:-1.0}"
    restart: "no"

  pitr-restore-drill:
    profiles: ["restore-drill"]
    image: aurum-pharma-backup:${AURUM_IMAGE_TAG:-local}
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    environment:
      AURUM_PITR_TARGET_NAME: "${AURUM_PITR_TARGET_NAME:-}"
    secrets:
      - source: restic_password
        target: RESTIC_PASSWORD
    volumes:
      - type: bind
        source: "${AURUM_BACKUP_REPOSITORY:?AURUM_BACKUP_REPOSITORY is required}"
        target: /repository
        read_only: true
      - type: bind
        source: "${AURUM_BACKUP_SCRATCH:?AURUM_BACKUP_SCRATCH is required}"
        target: /scratch
    networks:
      - recovery
    command: ["/bin/sh", "/opt/aurum/pitr-restore-drill.sh"]
    read_only: true
    tmpfs:
      - /workspace:size=64m,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: "${AURUM_BACKUP_MEMORY_LIMIT:-768m}"
    cpus: "${AURUM_BACKUP_CPU_LIMIT:-1.0}"
    restart: "no"

