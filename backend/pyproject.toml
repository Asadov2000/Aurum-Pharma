[tool.poetry]
name = "aurum-pharma-backend"
version = "0.1.0"
description = "Aurum Pharma — SaaS pharmacy automation for Tajikistan"
authors = ["Aurum Pharma"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.139,<0.142"
uvicorn = { extras = ["standard"], version = ">=0.32,<0.53" }
sqlalchemy = { extras = ["asyncio"], version = "2.0.*" }
asyncpg = ">=0.30,<0.32"
alembic = ">=1.14,<1.20"
pydantic = { extras = ["email"], version = ">=2.10,<2.14" }
pydantic-settings = ">=2.6,<2.16"
pyjwt = "2.13.*"
passlib = { extras = ["bcrypt"], version = "1.7.*" }
# passlib 1.7 still reads bcrypt.__about__.__version__, removed in bcrypt 4.x —
# stay on 3.x until passlib publishes a fix.
bcrypt = "<6.0"
celery = ">=5.4,<5.7"
redis = ">=5.2,<8.2"
structlog = ">=24.4,<26.2"
prometheus-client = ">=0.21,<0.27"
httpx = ">=0.27,<0.29"
minio = "7.2.*"
python-multipart = "0.0.*"
# Pure-Python PDF (receipt generation). No system libs of its own — only a
# Unicode TTF (fonts-dejavu-core, installed in the Dockerfile) for Cyrillic.
fpdf2 = "2.8.*"
# XLSX read+write (Z-report export now; catalog import in Phase 3 reuses it).
openpyxl = "3.1.*"
# Product images are decoded, stripped of metadata and re-encoded before storage.
pillow = "12.3.*"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0,<9.2"
pytest-asyncio = "1.4.*"
factory-boy = "3.3.*"
ruff = ">=0.7,<0.17"
black = "26.5.*"
mypy = ">=1.13,<2.4"
pip-audit = "2.10.*"
types-passlib = "*"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "PL", "RUF"]
ignore = [
    "PLR0913",  # too many arguments — common for FastAPI deps
    "PLR2004",  # magic values — too noisy
    "RUF001",   # ambiguous cyrillic chars — we ship Russian product strings
    "RUF002",   # same as RUF001 but in docstrings
    "RUF003",   # same as RUF001 but in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "alembic/versions"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["passlib.*", "jose.*", "celery.*", "factory.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
