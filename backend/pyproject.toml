[tool.poetry]
name = "aurum-pharma-backend"
version = "0.1.0"
description = "Aurum Pharma — SaaS pharmacy automation for Tajikistan"
authors = ["Aurum Pharma"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "0.115.*"
uvicorn = { extras = ["standard"], version = "0.32.*" }
sqlalchemy = { extras = ["asyncio"], version = "2.0.*" }
asyncpg = "0.30.*"
alembic = "1.14.*"
pydantic = { extras = ["email"], version = "2.10.*" }
pydantic-settings = "2.6.*"
python-jose = { extras = ["cryptography"], version = "3.3.*" }
passlib = { extras = ["bcrypt"], version = "1.7.*" }
# passlib 1.7 still reads bcrypt.__about__.__version__, removed in bcrypt 4.x —
# stay on 3.x until passlib publishes a fix.
bcrypt = "<4.0"
celery = "5.4.*"
redis = "5.2.*"
structlog = "24.4.*"
prometheus-client = "0.21.*"
httpx = "0.27.*"
minio = "7.2.*"
python-multipart = "0.0.*"
# Pure-Python PDF (receipt generation). No system libs of its own — only a
# Unicode TTF (fonts-dejavu-core, installed in the Dockerfile) for Cyrillic.
fpdf2 = "2.8.*"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.*"
pytest-asyncio = "0.24.*"
factory-boy = "3.3.*"
ruff = "0.7.*"
black = "24.10.*"
mypy = "1.13.*"
types-passlib = "*"
types-python-jose = "*"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "PL", "RUF"]
ignore = [
    "PLR0913",  # too many arguments — common for FastAPI deps
    "PLR2004",  # magic values — too noisy
    "RUF001",   # ambiguous cyrillic chars — we ship Russian product strings
    "RUF002",   # same as RUF001 but in docstrings
    "RUF003",   # same as RUF001 but in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "alembic/versions"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["passlib.*", "jose.*", "celery.*", "factory.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
