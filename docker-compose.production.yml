# Single-host production perimeter. Only the Caddy gateway publishes host ports.
# Secret values are mounted from root-owned files, never from this compose file.
name: aurum-production

x-backend-environment: &backend-environment
  ENVIRONMENT: production
  DEPLOYMENT_PROFILE: cloud
  AURUM_SECRETS_DIR: /run/secrets
  AURUM_DOMAIN: "${AURUM_DOMAIN:?AURUM_DOMAIN is required}"
  CORS_ORIGINS: '["${AURUM_PUBLIC_ORIGIN:?AURUM_PUBLIC_ORIGIN is required}"]'
  TRUSTED_HOSTS: '["${AURUM_DOMAIN:?AURUM_DOMAIN is required}","backend"]'
  TRUSTED_PROXY_IPS: '["${AURUM_PROXY_IP:-172.30.0.10}"]'
  REFRESH_COOKIE_SECURE: "true"
  REFRESH_COOKIE_SAMESITE: lax
  MINIO_ENDPOINT: minio:9000
  MINIO_BUCKET: aurum
  MINIO_SECURE: "false"
  MFA_ENCRYPTION_KEY_VERSION: "${AURUM_MFA_KEY_VERSION:-1}"
  EMAIL_OUTBOX_ENCRYPTION_KEY_VERSION: "${AURUM_EMAIL_OUTBOX_KEY_VERSION:-1}"
  LOG_LEVEL: "${AURUM_LOG_LEVEL:-INFO}"
  PYTHONPATH: /app

x-backend-secrets: &backend-secrets
  - source: database_url_app
    target: DATABASE_URL_APP
  - source: database_url_support
    target: DATABASE_URL_SUPPORT
  - source: redis_url
    target: REDIS_URL
  - source: jwt_secret
    target: JWT_SECRET
  - source: mfa_encryption_key
    target: MFA_ENCRYPTION_KEY
  - source: mfa_previous_keys
    target: MFA_ENCRYPTION_PREVIOUS_KEYS
  - source: email_outbox_encryption_key
    target: EMAIL_OUTBOX_ENCRYPTION_KEY
  - source: metrics_token
    target: METRICS_TOKEN
  - source: minio_access_key
    target: MINIO_ACCESS_KEY
  - source: minio_secret_key
    target: MINIO_SECRET_KEY

x-backend-service: &backend-service
  image: "aurum-pharma-backend:${AURUM_IMAGE_TAG:-local}"
  build:
    context: ./backend
    dockerfile: Dockerfile.production
  environment: *backend-environment
  secrets: *backend-secrets
  networks:
    - data
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  init: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    environment:
      POSTGRES_DB: aurum
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      AURUM_APP_PASSWORD_FILE: /run/secrets/AURUM_APP_PASSWORD
      AURUM_SUPPORT_PASSWORD_FILE: /run/secrets/AURUM_SUPPORT_PASSWORD
      AURUM_MIGRATOR_PASSWORD_FILE: /run/secrets/AURUM_MIGRATOR_PASSWORD
      AURUM_MAILER_PASSWORD_FILE: /run/secrets/AURUM_MAILER_PASSWORD
    secrets:
      - source: postgres_password
        target: POSTGRES_PASSWORD
      - source: aurum_app_password
        target: AURUM_APP_PASSWORD
      - source: aurum_support_password
        target: AURUM_SUPPORT_PASSWORD
      - source: aurum_migrator_password
        target: AURUM_MIGRATOR_PASSWORD
      - source: aurum_mailer_password
        target: AURUM_MAILER_PASSWORD
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./infra/postgres/role-contract.sql:/docker-entrypoint-initdb.d/role-contract.inc:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aurum"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    shm_size: 256mb
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        password="$$(cat /run/secrets/REDIS_PASSWORD)"
        test -n "$$password"
        printf 'user default on >%s ~* +@all\n' "$$password" > /tmp/users.acl
        exec redis-server --appendonly yes --aclfile /tmp/users.acl --protected-mode yes --maxmemory-policy noeviction
    secrets:
      - source: redis_password
        target: REDIS_PASSWORD
    volumes:
      - redis-data:/data
    networks:
      - data
    tmpfs:
      - /tmp:size=8m,mode=1777
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$(cat /run/secrets/REDIS_PASSWORD) redis-cli ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_BROWSER: "off"
      MINIO_ROOT_USER_FILE: /run/secrets/MINIO_ROOT_USER
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/MINIO_ROOT_PASSWORD
    secrets:
      - source: minio_root_user
        target: MINIO_ROOT_USER
      - source: minio_root_password
        target: MINIO_ROOT_PASSWORD
    volumes:
      - minio-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        root_user="$$(cat /run/secrets/MINIO_ROOT_USER)"
        root_password="$$(cat /run/secrets/MINIO_ROOT_PASSWORD)"
        app_user="$$(cat /run/secrets/MINIO_ACCESS_KEY)"
        app_password="$$(cat /run/secrets/MINIO_SECRET_KEY)"
        until mc --config-dir /tmp/.mc alias set local http://minio:9000 "$$root_user" "$$root_password" >/dev/null 2>&1; do
          sleep 2
        done
        mc --config-dir /tmp/.mc mb --ignore-existing local/aurum
        mc --config-dir /tmp/.mc admin user add local "$$app_user" "$$app_password"
        mc --config-dir /tmp/.mc admin policy create local aurum-app /config/aurum-app-policy.json
        mc --config-dir /tmp/.mc admin policy attach local aurum-app --user "$$app_user"
    secrets:
      - source: minio_root_user
        target: MINIO_ROOT_USER
      - source: minio_root_password
        target: MINIO_ROOT_PASSWORD
      - source: minio_access_key
        target: MINIO_ACCESS_KEY
      - source: minio_secret_key
        target: MINIO_SECRET_KEY
    volumes:
      - ./infra/minio/aurum-app-policy.json:/config/aurum-app-policy.json:ro
    networks:
      - data
    depends_on:
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  db-role-bootstrap:
    image: postgres:16-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    profiles: ["maintenance"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: aurum
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      AURUM_APP_PASSWORD_FILE: /run/secrets/AURUM_APP_PASSWORD
      AURUM_SUPPORT_PASSWORD_FILE: /run/secrets/AURUM_SUPPORT_PASSWORD
      AURUM_MIGRATOR_PASSWORD_FILE: /run/secrets/AURUM_MIGRATOR_PASSWORD
      AURUM_MAILER_PASSWORD_FILE: /run/secrets/AURUM_MAILER_PASSWORD
    secrets:
      - source: postgres_password
        target: POSTGRES_PASSWORD
      - source: aurum_app_password
        target: AURUM_APP_PASSWORD
      - source: aurum_support_password
        target: AURUM_SUPPORT_PASSWORD
      - source: aurum_migrator_password
        target: AURUM_MIGRATOR_PASSWORD
      - source: aurum_mailer_password
        target: AURUM_MAILER_PASSWORD
    volumes:
      - ./infra/postgres:/opt/aurum/postgres:ro
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "/opt/aurum/postgres/bootstrap-roles.sh"]
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  migrate:
    image: "aurum-pharma-backend:${AURUM_IMAGE_TAG:-local}"
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    profiles: ["maintenance"]
    environment:
      AURUM_SECRETS_DIR: /run/secrets
      PYTHONPATH: /app
    secrets:
      - source: database_url_support
        target: DATABASE_URL_SUPPORT
      - source: database_url_migration
        target: DATABASE_URL_MIGRATION
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.migrate", "upgrade", "head"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    init: true
    restart: "no"

  backend:
    <<: *backend-service
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "${AURUM_BACKEND_WORKERS:-1}",
        "--no-proxy-headers",
        "--no-server-header",
      ]
    networks:
      app:
      data:
      monitoring:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import json,urllib.request; request=urllib.request.Request(''http://127.0.0.1:8000/healthz'',headers={''Host'':''$$AURUM_DOMAIN''}); response=urllib.request.urlopen(request,timeout=5); assert json.load(response)[''status'']==''ok''"',
        ]
      interval: 10s
      timeout: 7s
      retries: 20
      start_period: 30s

  celery-worker:
    <<: *backend-service
    command:
      [
        "celery",
        "-A",
        "app.tasks.celery_app",
        "worker",
        "--loglevel=warning",
        "--concurrency=${AURUM_CELERY_CONCURRENCY:-2}",
        "--prefetch-multiplier=1",
        "-Q",
        "default",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  platform-mailer:
    image: "aurum-pharma-backend:${AURUM_IMAGE_TAG:-local}"
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    environment:
      ENVIRONMENT: production
      AURUM_SECRETS_DIR: /run/secrets
      EMAIL_OUTBOX_ENCRYPTION_KEY_VERSION: "${AURUM_EMAIL_OUTBOX_KEY_VERSION:-1}"
      EMAIL_HOST: "${AURUM_EMAIL_HOST:?AURUM_EMAIL_HOST is required}"
      EMAIL_PORT: "${AURUM_EMAIL_PORT:-587}"
      EMAIL_USER: "${AURUM_EMAIL_USER:?AURUM_EMAIL_USER is required}"
      EMAIL_FROM: "${AURUM_EMAIL_FROM:?AURUM_EMAIL_FROM is required}"
      EMAIL_USE_TLS: "${AURUM_EMAIL_USE_TLS:-true}"
      PUBLIC_APP_URL: "${AURUM_PUBLIC_ORIGIN:?AURUM_PUBLIC_ORIGIN is required}"
      EMAIL_OUTBOX_BATCH_SIZE: "${AURUM_MAILER_BATCH_SIZE:-25}"
      EMAIL_OUTBOX_CLAIM_TIMEOUT_SECONDS: "${AURUM_MAILER_CLAIM_TIMEOUT_SECONDS:-300}"
      LOG_LEVEL: "${AURUM_LOG_LEVEL:-INFO}"
      PYTHONPATH: /app
    secrets:
      - source: database_url_mailer
        target: DATABASE_URL_MAILER
      - source: redis_url
        target: REDIS_URL
      - source: email_outbox_encryption_key
        target: EMAIL_OUTBOX_ENCRYPTION_KEY
      - source: email_outbox_previous_keys
        target: EMAIL_OUTBOX_ENCRYPTION_PREVIOUS_KEYS
      - source: email_password
        target: EMAIL_PASSWORD
    networks:
      - data
      - mailer-egress
    command:
      [
        "celery",
        "-A",
        "app.tasks.mailer_app",
        "worker",
        "--loglevel=warning",
        "--concurrency=${AURUM_MAILER_CONCURRENCY:-1}",
        "--prefetch-multiplier=1",
        "-Q",
        "platform-mailer",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    init: true
    restart: unless-stopped

  celery-beat:
    <<: *backend-service
    command:
      [
        "celery",
        "-A",
        "app.tasks.celery_app",
        "beat",
        "--loglevel=warning",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    image: "aurum-pharma-gateway:${AURUM_IMAGE_TAG:-local}"
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    environment:
      AURUM_DOMAIN: "${AURUM_DOMAIN:?AURUM_DOMAIN is required}"
      AURUM_ACME_EMAIL: "${AURUM_ACME_EMAIL:?AURUM_ACME_EMAIL is required}"
    ports:
      - "${AURUM_HTTP_PORT:-80}:8080"
      - "${AURUM_HTTPS_PORT:-443}:8443"
      - "${AURUM_HTTPS_PORT:-443}:8443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      ingress:
      app:
        ipv4_address: "${AURUM_PROXY_IP:-172.30.0.10}"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    secrets:
      - source: metrics_token
        target: METRICS_TOKEN
    volumes:
      - ./infra/prometheus/prometheus.production.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    restart: unless-stopped

secrets:
  postgres_password:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/POSTGRES_PASSWORD"
  aurum_app_password:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/AURUM_APP_PASSWORD"
  aurum_support_password:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/AURUM_SUPPORT_PASSWORD"
  aurum_migrator_password:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/AURUM_MIGRATOR_PASSWORD"
  aurum_mailer_password:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/AURUM_MAILER_PASSWORD"
  database_url_app:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/DATABASE_URL_APP"
  database_url_support:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/DATABASE_URL_SUPPORT"
  database_url_migration:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/DATABASE_URL_MIGRATION"
  database_url_mailer:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/DATABASE_URL_MAILER"
  redis_password:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/REDIS_PASSWORD"
  redis_url:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/REDIS_URL"
  jwt_secret:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/JWT_SECRET"
  mfa_encryption_key:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/MFA_ENCRYPTION_KEY"
  mfa_previous_keys:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/MFA_ENCRYPTION_PREVIOUS_KEYS"
  email_outbox_encryption_key:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/EMAIL_OUTBOX_ENCRYPTION_KEY"
  email_outbox_previous_keys:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/EMAIL_OUTBOX_ENCRYPTION_PREVIOUS_KEYS"
  metrics_token:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/METRICS_TOKEN"
  minio_root_user:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/MINIO_ROOT_USER"
  minio_root_password:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/MINIO_ROOT_PASSWORD"
  minio_access_key:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/MINIO_ACCESS_KEY"
  minio_secret_key:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/MINIO_SECRET_KEY"
  email_password:
    file: "${AURUM_SECRET_FILES_DIR:?AURUM_SECRET_FILES_DIR is required}/EMAIL_PASSWORD"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  caddy-data:
  caddy-config:

networks:
  ingress:
  app:
    internal: true
    ipam:
      config:
        - subnet: "${AURUM_APP_NETWORK_CIDR:-172.30.0.0/24}"
  data:
    internal: true
  monitoring:
    internal: true
  mailer-egress:
