x-backend-dev-volumes: &backend-dev-volumes
  - ./backend/app:/app/app
  - ./backend/alembic:/app/alembic
  - ./backend/tests:/app/tests
  - ./backend/alembic.ini:/app/alembic.ini:ro
  - ./backend/pyproject.toml:/app/pyproject.toml:ro
  - ./infra:/infra:ro

x-backend-runtime-environment: &backend-runtime-environment
  - ENVIRONMENT
  - DEPLOYMENT_PROFILE
  - DATABASE_URL_APP
  - DATABASE_URL_SUPPORT
  - REDIS_URL=redis://:${REDIS_PASSWORD:-aurum_redis_pw}@redis:6379/0
  - CELERY_BROKER_URL=${CELERY_API_BROKER_URL:-redis://aurum_api:aurum_api_broker_pw@redis:6379/0}
  - JWT_SECRET
  - JWT_ALGORITHM
  - JWT_ISSUER=${JWT_ISSUER:-aurum-pharma}
  - JWT_AUDIENCE=${JWT_AUDIENCE:-aurum-pharma-api}
  - JWT_LEGACY_ACCESS_UNTIL=${JWT_LEGACY_ACCESS_UNTIL:-0}
  - MFA_ENCRYPTION_KEY
  - MFA_ENCRYPTION_KEY_VERSION
  - MFA_ENCRYPTION_PREVIOUS_KEYS
  - EMAIL_OUTBOX_ENCRYPTION_KEY
  - EMAIL_OUTBOX_ENCRYPTION_KEY_VERSION
  - EMAIL_OUTBOX_ENCRYPTION_PREVIOUS_KEYS
  - ACCESS_TOKEN_MINUTES
  - REFRESH_TOKEN_DAYS
  - MFA_STEP_UP_MINUTES
  - AUTH_LOCAL_TESTING_MODE
  - SMS_PROVIDER=${SMS_PROVIDER:-disabled}
  - PAYOM_API_URL
  - PAYOM_API_TOKEN
  - PAYOM_SENDER_NAME=${PAYOM_SENDER_NAME:-AurumPharma}
  - SMS_TIMEOUT_SECONDS=${SMS_TIMEOUT_SECONDS:-10}
  - SMS_DAILY_LIMIT=${SMS_DAILY_LIMIT:-100}
  - REFRESH_COOKIE_NAME
  - REFRESH_COOKIE_SAMESITE
  - REFRESH_COOKIE_SECURE
  - METRICS_TOKEN
  - CORS_ORIGINS
  - TRUSTED_HOSTS
  - TRUSTED_PROXY_IPS
  - MINIO_ENDPOINT
  - MINIO_ACCESS_KEY
  - MINIO_SECRET_KEY
  - MINIO_BUCKET
  - MINIO_SECURE
  - MAX_IMPORT_FILE_MB
  - EMAIL_HOST
  - EMAIL_PORT
  - EMAIL_USER
  - EMAIL_PASSWORD
  - EMAIL_FROM
  - EMAIL_USE_TLS
  - EMAIL_SMTP_TIMEOUT_SECONDS
  - EMAIL_OUTBOX_BATCH_SIZE
  - PUBLIC_APP_URL
  - APP_NAME
  - LOG_LEVEL
  - EDGE_SYNC_ENABLED
  - EDGE_SYNC_MAX_CLOCK_SKEW_SECONDS
  - EDGE_SYNC_NONCE_TTL_SECONDS
  - EDGE_SYNC_REQUESTS_PER_MINUTE
  - EDGE_SYNC_CLOUD_URL
  - EDGE_SYNC_CREDENTIAL
  - EDGE_SYNC_POLL_SECONDS
  - EDGE_SYNC_BATCH_SIZE
  - EDGE_BOOTSTRAP_TTL_SECONDS
  - EDGE_BOOTSTRAP_CHUNK_SIZE
  - EDGE_BOOTSTRAP_MAX_EVENTS
  - EDGE_WRITER_READINESS_ENABLED
  - EDGE_WRITER_ACTIVATION_ENABLED
  - PYTHONPATH=/app
  - WATCHFILES_FORCE_POLLING=true
  - WATCHFILES_POLL_DELAY_MS=1000

services:
  postgres:
    networks:
      - db
    image: postgres:16-alpine
    container_name: aurum-postgres
    environment:
      POSTGRES_DB: aurum
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AURUM_APP_PASSWORD: ${AURUM_APP_PASSWORD:-aurum_app_pw}
      AURUM_SUPPORT_PASSWORD: ${AURUM_SUPPORT_PASSWORD:-aurum_support_pw}
      AURUM_MAILER_PASSWORD: ${AURUM_MAILER_PASSWORD:-aurum_mailer_pw}
      AURUM_BILLING_WORKER_PASSWORD: ${AURUM_BILLING_WORKER_PASSWORD:-aurum_billing_worker_pw}
      AURUM_WORKER_PASSWORD: ${AURUM_WORKER_PASSWORD:-aurum_worker_pw}
      AURUM_CATALOG_WORKER_PASSWORD: ${AURUM_CATALOG_WORKER_PASSWORD:-aurum_catalog_worker_pw}
      AURUM_MIGRATOR_PASSWORD: ${AURUM_MIGRATOR_PASSWORD:-aurum_migrator_pw}
      AURUM_BACKUP_PASSWORD: ${AURUM_BACKUP_PASSWORD:-aurum_backup_pw}
      AURUM_PITR_PASSWORD: ${AURUM_PITR_PASSWORD:-aurum_pitr_pw}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./infra/postgres/role-contract.sql:/docker-entrypoint-initdb.d/role-contract.inc:ro
      - ./infra/postgres:/opt/aurum/postgres:ro
    healthcheck:
      # Probes the superuser (always exists). aurum_app is created later by
      # init.sh and would race with the first healthcheck. start_period covers
      # initdb + init.sh + the entrypoint's internal shutdown/restart (~60s).
      test: ["CMD-SHELL", "pg_isready -U postgres -d aurum"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  postgres-test:
    image: postgres:16-alpine
    container_name: aurum-postgres-test
    environment:
      POSTGRES_DB: aurum_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AURUM_APP_PASSWORD: ${AURUM_APP_PASSWORD:-aurum_app_pw}
      AURUM_SUPPORT_PASSWORD: ${AURUM_SUPPORT_PASSWORD:-aurum_support_pw}
      AURUM_MAILER_PASSWORD: ${AURUM_MAILER_PASSWORD:-aurum_mailer_pw}
      AURUM_BILLING_WORKER_PASSWORD: ${AURUM_BILLING_WORKER_PASSWORD:-aurum_billing_worker_pw}
      AURUM_WORKER_PASSWORD: ${AURUM_WORKER_PASSWORD:-aurum_worker_pw}
      AURUM_CATALOG_WORKER_PASSWORD: ${AURUM_CATALOG_WORKER_PASSWORD:-aurum_catalog_worker_pw}
      AURUM_MIGRATOR_PASSWORD: ${AURUM_MIGRATOR_PASSWORD:-aurum_migrator_pw}
      AURUM_BACKUP_PASSWORD: ${AURUM_BACKUP_PASSWORD:-aurum_backup_pw}
      AURUM_PITR_PASSWORD: ${AURUM_PITR_PASSWORD:-aurum_pitr_pw}
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./infra/postgres/role-contract.sql:/docker-entrypoint-initdb.d/role-contract.inc:ro
      - ./infra/postgres:/opt/aurum/postgres:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aurum_test"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  redis:
    networks:
      - broker
    tmpfs:
      - /tmp:size=8m,mode=1777
    environment:
      REDIS_TLS: "false"
      AURUM_REDIS_MAXMEMORY: "0"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-aurum_redis_pw}
      REDIS_CELERY_API_PASSWORD: ${REDIS_CELERY_API_PASSWORD:-aurum_api_broker_pw}
      REDIS_CELERY_BEAT_PASSWORD: ${REDIS_CELERY_BEAT_PASSWORD:-aurum_beat_broker_pw}
      REDIS_CELERY_SYSTEM_PASSWORD: ${REDIS_CELERY_SYSTEM_PASSWORD:-aurum_system_broker_pw}
      REDIS_CELERY_CATALOG_PASSWORD: ${REDIS_CELERY_CATALOG_PASSWORD:-aurum_catalog_broker_pw}
      REDIS_CELERY_BILLING_PASSWORD: ${REDIS_CELERY_BILLING_PASSWORD:-aurum_billing_broker_pw}
      REDIS_CELERY_MAILER_PASSWORD: ${REDIS_CELERY_MAILER_PASSWORD:-aurum_mailer_broker_pw}
    entrypoint: ["/bin/sh", "/config/start-with-worker-acl.sh"]
    image: redis:7-alpine
    container_name: aurum-redis
    volumes:
      - ./infra/redis/start-with-worker-acl.sh:/config/start-with-worker-acl.sh:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; fi; redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis-test:
    profiles: ["test"]
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    networks:
      - storage
    image: minio/minio:latest
    container_name: aurum-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    networks:
      - web
      - db
      - broker
      - storage
      - monitoring
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aurum-backend
    environment: *backend-runtime-environment
    volumes: *backend-dev-volumes
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app --reload-delay 1
    restart: unless-stopped

  db-owner-migrate:
    networks:
      - db
    profiles: ["maintenance"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PYTHONPATH: /app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MIGRATION_DB_HOST: postgres
      MIGRATION_DB_NAME: aurum
    volumes: *backend-dev-volumes
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m app.db_owner_migrate

  db-role-bootstrap:
    networks:
      - db
    profiles: ["maintenance"]
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: aurum
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AURUM_APP_PASSWORD: ${AURUM_APP_PASSWORD:-aurum_app_pw}
      AURUM_SUPPORT_PASSWORD: ${AURUM_SUPPORT_PASSWORD:-aurum_support_pw}
      AURUM_MAILER_PASSWORD: ${AURUM_MAILER_PASSWORD:-aurum_mailer_pw}
      AURUM_BILLING_WORKER_PASSWORD: ${AURUM_BILLING_WORKER_PASSWORD:-aurum_billing_worker_pw}
      AURUM_WORKER_PASSWORD: ${AURUM_WORKER_PASSWORD:-aurum_worker_pw}
      AURUM_CATALOG_WORKER_PASSWORD: ${AURUM_CATALOG_WORKER_PASSWORD:-aurum_catalog_worker_pw}
      AURUM_MIGRATOR_PASSWORD: ${AURUM_MIGRATOR_PASSWORD:-aurum_migrator_pw}
      AURUM_BACKUP_PASSWORD: ${AURUM_BACKUP_PASSWORD:-aurum_backup_pw}
      AURUM_PITR_PASSWORD: ${AURUM_PITR_PASSWORD:-aurum_pitr_pw}
    volumes:
      - ./infra/postgres:/opt/aurum/postgres:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "/opt/aurum/postgres/bootstrap-roles.sh"]

  edge-cash-identity:
    networks:
      - db
    profiles: ["maintenance"]
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: aurum
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./infra/postgres:/opt/aurum/postgres:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "/opt/aurum/postgres/manage-edge-cash-identity.sh"]

  migrate:
    networks:
      - db
    profiles: ["maintenance"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PYTHONPATH: /app
      DATABASE_URL_SUPPORT: ${DATABASE_URL_SUPPORT:-postgresql+asyncpg://aurum_support:aurum_support_pw@postgres:5432/aurum}
      DATABASE_URL_MIGRATION: ${DATABASE_URL_MIGRATION:-postgresql+asyncpg://aurum_migrator:aurum_migrator_pw@postgres:5432/aurum}
    volumes: *backend-dev-volumes
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m app.migrate upgrade head

  celery-worker:
    networks:
      - db
      - broker
    healthcheck:
      test: ["CMD", "python", "-m", "app.tasks.worker_health", "system", "/tmp/celery-worker.pid"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aurum-celery-worker
    environment:
      ENVIRONMENT: development
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER:-postgresql+asyncpg://aurum_worker:aurum_worker_pw@postgres:5432/aurum}
      CELERY_BROKER_URL: ${CELERY_SYSTEM_BROKER_URL:-redis://aurum_system:aurum_system_broker_pw@redis:6379/0}
      PYTHONPATH: /app
    volumes: *backend-dev-volumes
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q default --without-gossip --without-mingle --without-heartbeat --pidfile=/tmp/celery-worker.pid
    restart: unless-stopped

  catalog-minio-init:
    networks:
      - storage
    image: quay.io/minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: ["/bin/sh", "/config/provision-catalog-reader.sh"]
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_BUCKET: ${MINIO_BUCKET:-aurum}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      CATALOG_MINIO_ACCESS_KEY: ${CATALOG_MINIO_ACCESS_KEY:-aurum_catalog_reader}
      CATALOG_MINIO_SECRET_KEY: ${CATALOG_MINIO_SECRET_KEY:-aurum_catalog_reader_pw}
    volumes:
      - ./infra/minio/provision-catalog-reader.sh:/config/provision-catalog-reader.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  catalog-worker:
    networks:
      - db
      - broker
      - storage
    healthcheck:
      test: ["CMD", "python", "-m", "app.tasks.worker_health", "catalog", "/tmp/celery-worker.pid"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aurum-catalog-worker
    environment:
      ENVIRONMENT: development
      DATABASE_URL_CATALOG_WORKER: ${DATABASE_URL_CATALOG_WORKER:-postgresql+asyncpg://aurum_catalog_worker:aurum_catalog_worker_pw@postgres:5432/aurum}
      CELERY_BROKER_URL: ${CELERY_CATALOG_BROKER_URL:-redis://aurum_catalog:aurum_catalog_broker_pw@redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      CATALOG_MINIO_ACCESS_KEY: ${CATALOG_MINIO_ACCESS_KEY:-aurum_catalog_reader}
      CATALOG_MINIO_SECRET_KEY: ${CATALOG_MINIO_SECRET_KEY:-aurum_catalog_reader_pw}
      MINIO_BUCKET: ${MINIO_BUCKET:-aurum}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      PYTHONPATH: /app
    volumes: *backend-dev-volumes
    depends_on:
      catalog-minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: celery -A app.tasks.catalog_app worker --loglevel=info -Q catalog-worker --concurrency=1 --without-gossip --without-mingle --without-heartbeat --pidfile=/tmp/celery-worker.pid
    restart: unless-stopped

  billing-worker:
    networks:
      - db
      - broker
    healthcheck:
      test: ["CMD", "python", "-m", "app.tasks.worker_health", "billing", "/tmp/celery-worker.pid"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aurum-billing-worker
    environment:
      ENVIRONMENT: development
      DATABASE_URL_BILLING_WORKER: ${DATABASE_URL_BILLING_WORKER:-postgresql+asyncpg://aurum_billing_worker:aurum_billing_worker_pw@postgres:5432/aurum}
      CELERY_BROKER_URL: ${CELERY_BILLING_BROKER_URL:-redis://aurum_billing:aurum_billing_broker_pw@redis:6379/0}
      BILLING_TRANSITION_BATCH_SIZE: ${BILLING_TRANSITION_BATCH_SIZE:-100}
      PYTHONPATH: /app
    volumes: *backend-dev-volumes
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A app.tasks.billing_app worker --loglevel=info -Q billing-worker --concurrency=1 --without-gossip --without-mingle --without-heartbeat --pidfile=/tmp/celery-worker.pid
    restart: unless-stopped

  mailpit:
    networks:
      - mailer-egress
    image: axllent/mailpit:v1.31.0
    container_name: aurum-mailpit
    environment:
      MP_MAX_MESSAGES: 200
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  platform-mailer:
    networks:
      - db
      - broker
      - mailer-egress
    healthcheck:
      test: ["CMD", "python", "-m", "app.tasks.worker_health", "mailer", "/tmp/celery-worker.pid"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aurum-platform-mailer
    environment:
      ENVIRONMENT: development
      DATABASE_URL_MAILER: ${DATABASE_URL_MAILER:-postgresql+asyncpg://aurum_mailer:aurum_mailer_pw@postgres:5432/aurum}
      CELERY_BROKER_URL: ${CELERY_MAILER_BROKER_URL:-redis://aurum_mailer:aurum_mailer_broker_pw@redis:6379/0}
      EMAIL_OUTBOX_ENCRYPTION_KEY: ${EMAIL_OUTBOX_ENCRYPTION_KEY:-}
      EMAIL_OUTBOX_ENCRYPTION_KEY_VERSION: ${EMAIL_OUTBOX_ENCRYPTION_KEY_VERSION:-1}
      EMAIL_OUTBOX_ENCRYPTION_PREVIOUS_KEYS: ${EMAIL_OUTBOX_ENCRYPTION_PREVIOUS_KEYS:-{}}
      EMAIL_HOST: ${AURUM_DEV_EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${AURUM_DEV_EMAIL_PORT:-1025}
      EMAIL_USER: ${AURUM_DEV_EMAIL_USER:-}
      EMAIL_PASSWORD: ${AURUM_DEV_EMAIL_PASSWORD:-}
      EMAIL_FROM: ${AURUM_DEV_EMAIL_FROM:-no-reply@aurum-pharma.local}
      EMAIL_USE_TLS: ${AURUM_DEV_EMAIL_USE_TLS:-false}
      EMAIL_SMTP_TIMEOUT_SECONDS: ${EMAIL_SMTP_TIMEOUT_SECONDS:-10}
      EMAIL_OUTBOX_BATCH_SIZE: ${EMAIL_OUTBOX_BATCH_SIZE:-25}
      EMAIL_OUTBOX_CLAIM_TIMEOUT_SECONDS: ${EMAIL_OUTBOX_CLAIM_TIMEOUT_SECONDS:-300}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      PYTHONPATH: /app
    volumes: *backend-dev-volumes
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    command: celery -A app.tasks.mailer_app worker --loglevel=info -Q platform-mailer --concurrency=1 --without-gossip --without-mingle --without-heartbeat --pidfile=/tmp/celery-worker.pid
    restart: unless-stopped

  celery-beat:
    networks:
      - broker
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aurum-celery-beat
    environment:
      ENVIRONMENT: development
      CELERY_BROKER_URL: ${CELERY_BEAT_BROKER_URL:-redis://aurum_beat:aurum_beat_broker_pw@redis:6379/0}
      PYTHONPATH: /app
    volumes: *backend-dev-volumes
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.tasks.beat_app beat --loglevel=info
    restart: unless-stopped

  frontend:
    networks:
      - web
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aurum-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
      VITE_PUBLIC_WEBSITE_URL: ${VITE_PUBLIC_WEBSITE_URL:-}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/postcss.config.js:/app/postcss.config.js:ro
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/playwright.config.ts:/app/playwright.config.ts:ro
      - ./frontend/tests:/app/tests:ro
      - ./frontend/e2e:/app/e2e:ro
      - frontend-vite-cache:/app/node_modules/.vite
    ports:
      - "127.0.0.1:5173:5173"
    command: pnpm dev --host 0.0.0.0
    restart: unless-stopped

  prometheus:
    networks:
      - monitoring
    image: prom/prometheus:latest
    container_name: aurum-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  postgres-test-data:
  redis-data:
  minio-data:
  prometheus-data:
  frontend-vite-cache:

networks:
  web:
  db:
    internal: true
  broker:
    internal: true
  storage:
    internal: true
  mailer-egress:
  monitoring:
    internal: true
