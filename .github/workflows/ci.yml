name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      ENVIRONMENT: development
      DATABASE_URL_APP: postgresql+asyncpg://aurum_app:aurum_app_pw@localhost:5432/aurum_test
      DATABASE_URL_SUPPORT: postgresql+asyncpg://aurum_support:aurum_support_pw@localhost:5432/aurum_test
      TEST_DATABASE_URL_APP: postgresql+asyncpg://aurum_app:aurum_app_pw@localhost:5432/aurum_test
      TEST_DATABASE_URL_SUPPORT: postgresql+asyncpg://aurum_support:aurum_support_pw@localhost:5432/aurum_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-do-not-use-outside-tests-123456
      CORS_ORIGINS: '["http://localhost:5173"]'
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: aurum
      MINIO_SECURE: "false"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aurum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aurum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.3.4

      - name: Cache Poetry environment
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: backend/.venv
          key: ${{ runner.os }}-python-3.12-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-python-3.12-poetry-

      - name: Validate dependency lock
        run: poetry check --lock

      - name: Install locked dependencies
        run: poetry install --no-root --with dev --sync

      - name: Audit Python dependencies
        shell: bash
        run: |
          report=.pip-audit.json
          trap 'rm -f -- "$report"' EXIT

          for delay in 0 5 15; do
            sleep "$delay"
            : > "$report"

            poetry run pip-audit \
              --local \
              --format=json \
              --output="$report" \
              --progress-spinner=off \
              --desc=off \
              --aliases=on \
              --timeout=20 || true

            if [ -s "$report" ]; then
              python - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              dependencies = json.load(stream)["dependencies"]

          skipped = [item for item in dependencies if item.get("skip_reason")]
          vulnerabilities = [
              (item["name"], vulnerability["id"], vulnerability.get("fix_versions", []))
              for item in dependencies
              for vulnerability in item.get("vulns", [])
          ]

          for item in skipped:
              print(f"SKIPPED {item['name']}: {item['skip_reason']}")
          for name, vulnerability_id, fixes in vulnerabilities:
              print(f"VULNERABLE {name}: {vulnerability_id}; fixes={fixes}")

          raise SystemExit(1 if skipped or vulnerabilities else 0)
          PY
              exit 0
            fi
          done

          echo "::warning title=Python audit unavailable::No complete report after 3 attempts"

      - name: Start MinIO
        run: |
          docker run --detach \
            --name aurum-ci-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is ready"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs aurum-ci-minio
              exit 1
            fi
            sleep 2
          done

      - name: Create PostgreSQL app and support roles
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          test -n "$POSTGRES_SERVICE_ID"
          docker exec -i \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=aurum_test \
            -e AURUM_APP_PASSWORD=aurum_app_pw \
            -e AURUM_SUPPORT_PASSWORD=aurum_support_pw \
            "$POSTGRES_SERVICE_ID" sh -s < ../infra/postgres/init.sh

      - name: Apply migrations
        run: poetry run alembic upgrade head

      - name: Ruff
        run: poetry run ruff check app tests

      - name: Black
        run: poetry run black --check app tests

      - name: Mypy
        run: poetry run mypy app

      - name: Pytest
        run: poetry run pytest tests/ -q

      - name: Stop MinIO
        if: always()
        run: |
          if docker container inspect aurum-ci-minio > /dev/null 2>&1; then
            docker rm --force aurum-ci-minio
          fi

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9.12.0

      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high --ignore-registry-errors

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  e2e:
    name: Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9.12.0

      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare development environment
        run: cp .env.example .env

      - name: Start isolated application stack
        run: |
          docker compose up -d --build postgres redis minio backend celery-worker frontend
          docker compose ps

      - name: Migrate and seed disposable E2E database
        run: |
          docker compose exec -T backend alembic upgrade head
          docker compose exec -T -e AURUM_E2E_SEED=1 backend python -m app.seed_e2e
          docker compose exec -T backend python -m app.seed_demo

      - name: Restart frontend and wait for HTTP readiness
        shell: bash
        run: |
          docker compose restart frontend

          wait_for_url() {
            local name="$1"
            local url="$2"
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error "$url" > /dev/null; then
                echo "$name is ready"
                return 0
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "$name did not become ready: $url"
                return 1
              fi
              sleep 2
            done
          }

          wait_for_url "Backend" "http://localhost:8000/healthz"
          wait_for_url "Frontend" "http://localhost:5173"

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          CI: "true"
        run: pnpm e2e

      - name: Show service logs on failure
        if: failure()
        run: >-
          docker compose logs --no-color --tail=250
          postgres redis minio backend celery-worker frontend

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop isolated application stack
        if: always()
        run: docker compose down -v --remove-orphans
