name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    # 06:30 in Tajikistan (UTC+5): catches dependency and runner drift daily.
    - cron: "30 1 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-tooling:
    name: Verification tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test change classifier and verification planner
        shell: pwsh
        run: ./scripts/test-verification-tools.ps1

      - name: Test Windows PowerShell 5.1 compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/test-verification-tools.ps1
          ./scripts/test-manage-edge-cash-identity.ps1

      - name: Test Edge identity Windows wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-manage-edge-cash-identity.ps1

  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      ENVIRONMENT: development
      DATABASE_URL_APP: postgresql+asyncpg://aurum_app:aurum_app_pw@localhost:5432/aurum_test
      DATABASE_URL_SUPPORT: postgresql+asyncpg://aurum_support:aurum_support_pw@localhost:5432/aurum_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://aurum_migrator:aurum_migrator_pw@localhost:5432/aurum_test
      DATABASE_URL_MAILER: postgresql+asyncpg://aurum_mailer:aurum_mailer_pw@localhost:5432/aurum_test
      DATABASE_URL_BILLING_WORKER: postgresql+asyncpg://aurum_billing_worker:aurum_billing_worker_pw@localhost:5432/aurum_test
      TEST_DATABASE_URL_APP: postgresql+asyncpg://aurum_app:aurum_app_pw@localhost:5432/aurum_test
      TEST_DATABASE_URL_SUPPORT: postgresql+asyncpg://aurum_support:aurum_support_pw@localhost:5432/aurum_test
      TEST_DATABASE_URL_MIGRATION: postgresql+asyncpg://aurum_migrator:aurum_migrator_pw@localhost:5432/aurum_test
      TEST_DATABASE_URL_MAILER: postgresql+asyncpg://aurum_mailer:aurum_mailer_pw@localhost:5432/aurum_test
      TEST_DATABASE_URL_BILLING_WORKER: postgresql+asyncpg://aurum_billing_worker:aurum_billing_worker_pw@localhost:5432/aurum_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-do-not-use-outside-tests-123456
      CORS_ORIGINS: '["http://localhost:5173"]'
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: aurum
      MINIO_SECURE: "false"

    services:
      postgres:
        image: postgres:16-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aurum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aurum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.3.4

      - name: Cache Poetry environment
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: backend/.venv
          key: ${{ runner.os }}-python-3.12-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-python-3.12-poetry-

      - name: Validate dependency lock
        run: poetry check --lock

      - name: Install locked dependencies
        run: poetry install --no-root --with dev --sync

      - name: Cache Mypy analysis
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: backend/.mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('backend/poetry.lock', 'backend/app/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-mypy-

      - name: Start MinIO
        run: |
          docker run --detach \
            --name aurum-ci-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is ready"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs aurum-ci-minio
              exit 1
            fi
            sleep 2
          done

      - name: Build a real legacy 0066 database
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          test -n "$POSTGRES_SERVICE_ID"
          docker exec -i "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test <<'SQL'
          CREATE ROLE aurum_app
            LOGIN INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE
            NOREPLICATION NOBYPASSRLS PASSWORD 'aurum_app_pw';
          CREATE ROLE aurum_support
            LOGIN INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE
            NOREPLICATION BYPASSRLS PASSWORD 'aurum_support_pw';
          ALTER SCHEMA public OWNER TO aurum_support;
          GRANT ALL PRIVILEGES ON DATABASE aurum_test TO aurum_support;
          GRANT CONNECT ON DATABASE aurum_test TO aurum_app;
          SQL
          poetry run python -m app.migrate legacy-upgrade 0029
          POSTGRES_USER=postgres \
          POSTGRES_PASSWORD=postgres \
          MIGRATION_DB_HOST=localhost \
          MIGRATION_DB_NAME=aurum_test \
            poetry run python -m app.db_owner_migrate
          poetry run python -m app.migrate legacy-upgrade 0066

      - name: Bootstrap separated PostgreSQL roles and privileges
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          test -n "$POSTGRES_SERVICE_ID"
          docker cp \
            ../infra/postgres/role-contract.sql \
            "$POSTGRES_SERVICE_ID:/tmp/role-contract.sql"
          docker cp \
            ../infra/postgres/bootstrap-roles.sh \
            "$POSTGRES_SERVICE_ID:/tmp/bootstrap-roles.sh"
          docker exec "$POSTGRES_SERVICE_ID" sh -c '
            printf %s postgres > /tmp/aurum-postgres-password
            printf %s aurum_app_pw > /tmp/aurum-app-password
            printf %s aurum_support_pw > /tmp/aurum-support-password
            printf %s aurum_migrator_pw > /tmp/aurum-migrator-password
            printf %s aurum_mailer_pw > /tmp/aurum-mailer-password
            printf %s aurum_billing_worker_pw > /tmp/aurum-billing-worker-password
            printf %s aurum_backup_pw > /tmp/aurum-backup-password
            printf %s aurum_pitr_pw > /tmp/aurum-pitr-password
          '
          docker exec -i \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=aurum_test \
            -e POSTGRES_PASSWORD_FILE=/tmp/aurum-postgres-password \
            -e AURUM_APP_PASSWORD_FILE=/tmp/aurum-app-password \
            -e AURUM_SUPPORT_PASSWORD_FILE=/tmp/aurum-support-password \
            -e AURUM_MIGRATOR_PASSWORD_FILE=/tmp/aurum-migrator-password \
            -e AURUM_MAILER_PASSWORD_FILE=/tmp/aurum-mailer-password \
            -e AURUM_BILLING_WORKER_PASSWORD_FILE=/tmp/aurum-billing-worker-password \
            -e AURUM_BACKUP_PASSWORD_FILE=/tmp/aurum-backup-password \
            -e AURUM_PITR_PASSWORD_FILE=/tmp/aurum-pitr-password \
            "$POSTGRES_SERVICE_ID" sh -c '
              unset \
                POSTGRES_PASSWORD \
                AURUM_APP_PASSWORD \
                AURUM_SUPPORT_PASSWORD \
                AURUM_MIGRATOR_PASSWORD \
                AURUM_MAILER_PASSWORD \
                AURUM_BILLING_WORKER_PASSWORD \
                AURUM_BACKUP_PASSWORD \
                AURUM_PITR_PASSWORD
              exec sh /tmp/bootstrap-roles.sh
            '

      - name: Verify cluster-safe migration roundtrip
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          actual_head="$(poetry run alembic heads | awk 'NR == 1 { print $1 }')"
          actual_head_number="$(printf '%s' "$actual_head" | sed 's/^0*//')"
          role_contract_head="$(
            sed -nE \
              's/.*revision_number > ([0-9]+).*/\1/p' \
              ../infra/postgres/role-contract.sql
          )"
          test -n "$actual_head"
          [[ "$actual_head" =~ ^[0-9]{4}$ ]]
          test -n "$actual_head_number"
          test "$actual_head_number" = "$role_contract_head"

          run_role_bootstrap() {
            docker exec -i \
              -e POSTGRES_HOST=127.0.0.1 \
              -e POSTGRES_PORT=5432 \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_DB=aurum_test \
              -e POSTGRES_PASSWORD_FILE=/tmp/aurum-postgres-password \
              -e AURUM_APP_PASSWORD_FILE=/tmp/aurum-app-password \
              -e AURUM_SUPPORT_PASSWORD_FILE=/tmp/aurum-support-password \
              -e AURUM_MIGRATOR_PASSWORD_FILE=/tmp/aurum-migrator-password \
              -e AURUM_MAILER_PASSWORD_FILE=/tmp/aurum-mailer-password \
              -e AURUM_BILLING_WORKER_PASSWORD_FILE=/tmp/aurum-billing-worker-password \
              -e AURUM_BACKUP_PASSWORD_FILE=/tmp/aurum-backup-password \
              -e AURUM_PITR_PASSWORD_FILE=/tmp/aurum-pitr-password \
              "$POSTGRES_SERVICE_ID" sh -c '
                unset \
                  POSTGRES_PASSWORD \
                  AURUM_APP_PASSWORD \
                  AURUM_SUPPORT_PASSWORD \
                  AURUM_MIGRATOR_PASSWORD \
                  AURUM_MAILER_PASSWORD \
                  AURUM_BILLING_WORKER_PASSWORD \
                  AURUM_BACKUP_PASSWORD \
                  AURUM_PITR_PASSWORD
                exec sh /tmp/bootstrap-roles.sh
              '
          }

          docker exec -i "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test <<'SQL'
          GRANT aurum_support TO aurum_edge_cash_executor;
          CREATE SCHEMA edge_acl_probe;
          CREATE TABLE edge_acl_probe.probe (id INTEGER);
          CREATE PROCEDURE edge_acl_probe.probe_procedure()
          LANGUAGE SQL AS $$ SELECT 1 $$;
          GRANT USAGE ON SCHEMA edge_acl_probe TO aurum_edge_cash_executor;
          GRANT SELECT ON TABLE edge_acl_probe.probe TO aurum_edge_cash_executor;
          GRANT EXECUTE ON PROCEDURE edge_acl_probe.probe_procedure()
            TO aurum_edge_cash_executor;
          SQL
          run_role_bootstrap
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT pg_has_role('aurum_edge_cash_executor', 'aurum_support', 'MEMBER')"
          )" = "f"
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT has_schema_privilege('aurum_edge_cash_executor', 'edge_acl_probe', 'USAGE')"
          )" = "f"
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT has_table_privilege('aurum_edge_cash_executor', 'edge_acl_probe.probe', 'SELECT')"
          )" = "f"
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT has_function_privilege('aurum_edge_cash_executor', routines.oid, 'EXECUTE') FROM pg_proc AS routines JOIN pg_namespace AS schemas ON schemas.oid = routines.pronamespace WHERE schemas.nspname = 'edge_acl_probe' AND routines.proname = 'probe_procedure'"
          )" = "f"
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT bool_and(rolpassword IS NULL) FROM pg_authid WHERE rolname IN ('aurum_edge_cash_executor', 'aurum_edge_cash_owner')"
          )" = "t"
          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test \
            -c "DROP SCHEMA edge_acl_probe CASCADE"

          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test \
            -c "CREATE SCHEMA edge_owner_probe AUTHORIZATION aurum_edge_cash_owner"
          if run_role_bootstrap; then
            echo "role bootstrap accepted an Edge-owned sentinel schema"
            exit 1
          fi
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT pg_get_userbyid(nspowner) FROM pg_namespace WHERE nspname = 'edge_owner_probe'"
          )" = "aurum_edge_cash_owner"
          docker exec -i "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test <<'SQL'
          ALTER SCHEMA edge_owner_probe OWNER TO postgres;
          DROP SCHEMA edge_owner_probe;
          SQL

          docker exec -i "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test <<'SQL'
          CREATE TYPE public.edge_owner_probe AS ENUM ('probe');
          ALTER TYPE public.edge_owner_probe OWNER TO aurum_edge_cash_owner;
          SQL
          if run_role_bootstrap; then
            echo "role bootstrap accepted an Edge-owned sentinel type"
            exit 1
          fi
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT pg_get_userbyid(types.typowner) FROM pg_type AS types JOIN pg_namespace AS schemas ON schemas.oid = types.typnamespace WHERE schemas.nspname = 'public' AND types.typname = 'edge_owner_probe'"
          )" = "aurum_edge_cash_owner"
          docker exec -i "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test <<'SQL'
          ALTER TYPE public.edge_owner_probe OWNER TO postgres;
          DROP TYPE public.edge_owner_probe;
          SQL

          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test \
            -c "ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT SELECT ON TABLES TO aurum_edge_cash_executor"
          if run_role_bootstrap; then
            echo "role bootstrap accepted an Edge default privilege"
            exit 1
          fi
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT count(*) FROM pg_default_acl AS defaults CROSS JOIN LATERAL aclexplode(defaults.defaclacl) AS acl JOIN pg_roles AS grantees ON grantees.oid = acl.grantee WHERE grantees.rolname = 'aurum_edge_cash_executor'"
          )" = "1"
          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test \
            -c "ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE SELECT ON TABLES FROM aurum_edge_cash_executor"

          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "CREATE DATABASE aurum_edge_sentinel_test OWNER aurum_edge_cash_owner"
          if run_role_bootstrap; then
            echo "role bootstrap accepted an Edge-owned sentinel database"
            exit 1
          fi
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d postgres -Atc \
              "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'aurum_edge_sentinel_test'"
          )" = "aurum_edge_cash_owner"
          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "DROP DATABASE aurum_edge_sentinel_test"

          docker exec -u postgres "$POSTGRES_SERVICE_ID" \
            mkdir -p /tmp/aurum-edge-tablespace
          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "CREATE TABLESPACE aurum_edge_sentinel OWNER aurum_edge_cash_owner LOCATION '/tmp/aurum-edge-tablespace'"
          if run_role_bootstrap; then
            echo "role bootstrap accepted an Edge-owned sentinel tablespace"
            exit 1
          fi
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d postgres -Atc \
              "SELECT pg_get_userbyid(spcowner) FROM pg_tablespace WHERE spcname = 'aurum_edge_sentinel'"
          )" = "aurum_edge_cash_owner"
          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "DROP TABLESPACE aurum_edge_sentinel"

          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "CREATE DATABASE aurum_sentinel_test OWNER aurum_support"
          if poetry run python -m app.migrate upgrade head; then
            echo "0067 upgrade ignored a support-owned sentinel database"
            exit 1
          fi
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d postgres -Atc \
              "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'aurum_sentinel_test'"
          )" = "aurum_support"
          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "DROP DATABASE aurum_sentinel_test"

          docker exec -u postgres "$POSTGRES_SERVICE_ID" \
            mkdir -p /tmp/aurum-support-tablespace
          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "CREATE TABLESPACE aurum_support_sentinel OWNER aurum_support LOCATION '/tmp/aurum-support-tablespace'"
          if poetry run python -m app.migrate upgrade head; then
            echo "0067 upgrade ignored a support-owned sentinel tablespace"
            exit 1
          fi
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d postgres -Atc \
              "SELECT pg_get_userbyid(spcowner) FROM pg_tablespace WHERE spcname = 'aurum_support_sentinel'"
          )" = "aurum_support"
          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "DROP TABLESPACE aurum_support_sentinel"

          poetry run python -m app.migrate upgrade 0091
          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test \
            -c "REVOKE REFERENCES ON TABLE public.app_user, public.tenant FROM aurum_schema_owner"
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT has_table_privilege('aurum_schema_owner', 'public.app_user', 'REFERENCES')"
          )" = "f"
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT has_table_privilege('aurum_schema_owner', 'public.tenant', 'REFERENCES')"
          )" = "f"
          poetry run python -m app.migrate upgrade head
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT has_table_privilege('aurum_schema_owner', 'public.app_user', 'REFERENCES')"
          )" = "f"
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT has_table_privilege('aurum_schema_owner', 'public.tenant', 'REFERENCES')"
          )" = "f"
          # Restore the fixture before the independent downgrade/upgrade roundtrip.
          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test \
            -c "GRANT REFERENCES ON TABLE public.app_user, public.tenant TO aurum_schema_owner"

          docker exec -i "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test <<'SQL'
          INSERT INTO public.app_user (id, email, full_name, status)
          VALUES (
            '94000000-0000-4000-8000-000000000001',
            'billing-0094-downgrade@example.invalid',
            'Billing 0094 downgrade guard',
            'active'
          );
          INSERT INTO public.billing_plan (code, name, created_by)
          VALUES (
            'billing_0094_guard',
            'Billing 0094 downgrade guard',
            '94000000-0000-4000-8000-000000000001'
          );
          INSERT INTO public.tenant (id, name, contact_email)
          VALUES (
            '94000000-0000-4000-8000-000000000002',
            'Billing 0094 legacy tenant',
            'billing-0094-legacy@example.invalid'
          );
          INSERT INTO public.tenant_subscription (
            id, tenant_id, plan_id, status, period_end, branches_count, amount
          ) VALUES (
            '94000000-0000-4000-8000-000000000003',
            '94000000-0000-4000-8000-000000000002',
            (SELECT id FROM public.subscription_plan WHERE code = 'aurum_pharma'),
            'active',
            now() + interval '30 days',
            1,
            321.00
          );
          SQL
          if poetry run python -m app.migrate downgrade 0093 --allow-test-downgrade; then
            echo "0094 downgrade removed non-empty versioned pricing tables"
            exit 1
          fi
          docker exec -i "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test <<'SQL'
          DELETE FROM public.billing_plan WHERE code = 'billing_0094_guard';
          DELETE FROM public.app_user
          WHERE id = '94000000-0000-4000-8000-000000000001';
          SQL
          poetry run python -m app.migrate downgrade 0093 --allow-test-downgrade
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT version_num FROM public.alembic_version"
          )" = "0093"
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT to_regclass('public.billing_plan') IS NULL"
          )" = "t"
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT count(*) = 1 AND bool_and(amount = 321.00) FROM public.tenant_subscription WHERE id = '94000000-0000-4000-8000-000000000003'"
          )" = "t"
          poetry run python -m app.migrate upgrade head
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT count(*) = 1 AND bool_and(amount = 321.00) FROM public.tenant_subscription WHERE id = '94000000-0000-4000-8000-000000000003'"
          )" = "t"
          # 0095 is independently reversible only while its immutable
          # administration journal is empty. Existing 0094 pricing data stays.
          poetry run python -m app.migrate downgrade 0094 --allow-test-downgrade
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT version_num FROM public.alembic_version"
          )" = "0094"
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT to_regclass('public.billing_plan') IS NOT NULL"
          )" = "t"
          poetry run python -m app.migrate upgrade 0095
          docker exec -i "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test <<'SQL'
          INSERT INTO public.tenant_subscription (
            id, tenant_id, plan_id, status, period_start, period_end,
            branches_count, amount
          ) VALUES (
            '94000000-0000-4000-8000-000000000004',
            '94000000-0000-4000-8000-000000000002',
            (SELECT id FROM public.subscription_plan WHERE code = 'aurum_pharma'),
            'active',
            now() + interval '30 days',
            now() + interval '60 days',
            1,
            654.00
          );
          SQL
          if poetry run python -m app.migrate upgrade head; then
            echo "0096 accepted ambiguous current tenant subscriptions"
            exit 1
          fi
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT version_num FROM public.alembic_version"
          )" = "0095"
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT string_agg(id::text || ':' || status, ',' ORDER BY id) FROM public.tenant_subscription WHERE tenant_id = '94000000-0000-4000-8000-000000000002'"
          )" = "94000000-0000-4000-8000-000000000003:active,94000000-0000-4000-8000-000000000004:active"
          docker exec -i "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test <<'SQL'
          DELETE FROM public.tenant_subscription
          WHERE id = '94000000-0000-4000-8000-000000000004';
          SQL
          poetry run python -m app.migrate upgrade head
          docker exec -i "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test <<'SQL'
          DELETE FROM public.tenant_subscription
          WHERE id = '94000000-0000-4000-8000-000000000003';
          DELETE FROM public.tenant_settings
          WHERE tenant_id = '94000000-0000-4000-8000-000000000002';
          DELETE FROM public.tenant
          WHERE id = '94000000-0000-4000-8000-000000000002';
          SQL

          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "CREATE DATABASE aurum_sentinel_test OWNER aurum_schema_owner"
          if poetry run python -m app.migrate downgrade 0066 --allow-test-downgrade; then
            echo "0067 downgrade ignored an owner-owned sentinel database"
            exit 1
          fi
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d postgres -Atc \
              "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'aurum_sentinel_test'"
          )" = "aurum_schema_owner"
          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "DROP DATABASE aurum_sentinel_test"

          docker exec -u postgres "$POSTGRES_SERVICE_ID" \
            mkdir -p /tmp/aurum-owner-tablespace
          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "CREATE TABLESPACE aurum_owner_sentinel OWNER aurum_schema_owner LOCATION '/tmp/aurum-owner-tablespace'"
          if poetry run python -m app.migrate downgrade 0066 --allow-test-downgrade; then
            echo "0067 downgrade ignored an owner-owned sentinel tablespace"
            exit 1
          fi
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d postgres -Atc \
              "SELECT pg_get_userbyid(spcowner) FROM pg_tablespace WHERE spcname = 'aurum_owner_sentinel'"
          )" = "aurum_schema_owner"
          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "DROP TABLESPACE aurum_owner_sentinel"

          poetry run python -m app.migrate downgrade 0055 --allow-test-downgrade
          run_role_bootstrap
          poetry run python -m app.migrate upgrade head
          run_role_bootstrap

      - name: Verify revision bootstrap fails closed
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          actual_head="$(poetry run alembic heads | awk 'NR == 1 { print $1 }')"
          [[ "$actual_head" =~ ^[0-9]{4}$ ]]

          run_role_contract() {
            docker exec -i \
              -e POSTGRES_HOST=127.0.0.1 \
              -e POSTGRES_PORT=5432 \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_DB=aurum_test \
              -e POSTGRES_PASSWORD_FILE=/tmp/aurum-postgres-password \
              -e AURUM_APP_PASSWORD_FILE=/tmp/aurum-app-password \
              -e AURUM_SUPPORT_PASSWORD_FILE=/tmp/aurum-support-password \
              -e AURUM_MIGRATOR_PASSWORD_FILE=/tmp/aurum-migrator-password \
              -e AURUM_MAILER_PASSWORD_FILE=/tmp/aurum-mailer-password \
              -e AURUM_BILLING_WORKER_PASSWORD_FILE=/tmp/aurum-billing-worker-password \
              -e AURUM_BACKUP_PASSWORD_FILE=/tmp/aurum-backup-password \
              -e AURUM_PITR_PASSWORD_FILE=/tmp/aurum-pitr-password \
              "$POSTGRES_SERVICE_ID" sh -c '
                unset \
                  POSTGRES_PASSWORD \
                  AURUM_APP_PASSWORD \
                  AURUM_SUPPORT_PASSWORD \
                  AURUM_MIGRATOR_PASSWORD \
                  AURUM_MAILER_PASSWORD \
                  AURUM_BILLING_WORKER_PASSWORD \
                  AURUM_BACKUP_PASSWORD \
                  AURUM_PITR_PASSWORD
                exec sh /tmp/bootstrap-roles.sh
              '
          }

          database_security_state() {
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc "
                WITH role_state AS (
                  SELECT
                    rolname,
                    rolcanlogin,
                    rolinherit,
                    rolsuper,
                    rolcreatedb,
                    rolcreaterole,
                    rolreplication,
                    rolbypassrls,
                    pg_catalog.md5(COALESCE(rolpassword, '')) AS password_fingerprint
                  FROM pg_catalog.pg_authid
                  WHERE rolname IN (
                    'aurum_app',
                    'aurum_edge_cash_executor',
                    'aurum_edge_cash_owner',
                    'aurum_billing_worker',
                    'aurum_mailer',
                    'aurum_support',
                    'aurum_migrator',
                    'aurum_schema_owner'
                  )
                ),
                membership_state AS (
                  SELECT
                    granted.rolname AS granted_role,
                    member.rolname AS member_role,
                    membership.admin_option,
                    membership.inherit_option,
                    membership.set_option
                  FROM pg_catalog.pg_auth_members AS membership
                  JOIN pg_catalog.pg_roles AS granted
                    ON granted.oid = membership.roleid
                  JOIN pg_catalog.pg_roles AS member
                    ON member.oid = membership.member
                  WHERE granted.rolname LIKE 'aurum_%'
                     OR member.rolname LIKE 'aurum_%'
                ),
                database_state AS (
                  SELECT
                    pg_catalog.pg_get_userbyid(datdba) AS owner,
                    datacl::TEXT AS acl
                  FROM pg_catalog.pg_database
                  WHERE datname = current_database()
                )
                SELECT pg_catalog.md5(
                  COALESCE((
                    SELECT pg_catalog.jsonb_agg(
                      pg_catalog.to_jsonb(role_state)
                      ORDER BY rolname
                    )::TEXT
                    FROM role_state
                  ), '') ||
                  COALESCE((
                    SELECT pg_catalog.jsonb_agg(
                      pg_catalog.to_jsonb(membership_state)
                      ORDER BY granted_role, member_role
                    )::TEXT
                    FROM membership_state
                  ), '') ||
                  COALESCE((
                    SELECT pg_catalog.to_jsonb(database_state)::TEXT
                    FROM database_state
                  ), '')
                )
              "
          }

          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test \
            -c "DELETE FROM public.alembic_version"
          before_state="$(database_security_state)"
          if run_role_contract; then
            echo "bootstrap accepted an empty revision ledger"
            exit 1
          fi
          test "$before_state" = "$(database_security_state)"
          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test \
            -c "INSERT INTO public.alembic_version(version_num) VALUES ('0067')"
          run_role_contract

          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test \
            -c "INSERT INTO public.alembic_version(version_num) VALUES ('0066')"
          before_state="$(database_security_state)"
          if run_role_contract; then
            echo "bootstrap accepted a multi-head revision ledger"
            exit 1
          fi
          test "$before_state" = "$(database_security_state)"
          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test \
            -c "DELETE FROM public.alembic_version WHERE version_num = '0066'"
          run_role_contract

          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test \
            -c "UPDATE public.alembic_version SET version_num = '9999'"
          before_state="$(database_security_state)"
          if run_role_contract; then
            echo "bootstrap accepted an unknown revision"
            exit 1
          fi
          test "$before_state" = "$(database_security_state)"
          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test \
            -c "UPDATE public.alembic_version SET version_num = '0067'"
          run_role_contract

          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test \
            -c "ALTER TABLE public.alembic_version RENAME TO alembic_version_missing"
          before_state="$(database_security_state)"
          if run_role_contract; then
            echo "bootstrap accepted a missing revision ledger in a populated database"
            exit 1
          fi
          test "$before_state" = "$(database_security_state)"
          if poetry run python -m app.migrate upgrade head; then
            echo "migration runner accepted a missing revision ledger in a populated database"
            exit 1
          fi
          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test \
            -c "ALTER TABLE public.alembic_version_missing RENAME TO alembic_version"
          run_role_contract

          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test \
            -c "CREATE SCHEMA shadow; CREATE TABLE shadow.alembic_version(version_num TEXT); INSERT INTO shadow.alembic_version VALUES ('9999')"
          run_role_contract
          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test \
            -c "DROP SCHEMA shadow CASCADE"

          # The negative checks intentionally spoof older revisions without
          # downgrading objects. Restore the actual head before application tests.
          docker exec "$POSTGRES_SERVICE_ID" \
            psql -v ON_ERROR_STOP=1 -U postgres -d aurum_test \
              -c "UPDATE public.alembic_version SET version_num = '$actual_head'"
          run_role_contract
          test "$(
            docker exec "$POSTGRES_SERVICE_ID" \
              psql -U postgres -d aurum_test -Atc \
              "SELECT has_schema_privilege('aurum_mailer', 'public', 'USAGE')"
          )" = "t"

      - name: Ruff
        run: poetry run ruff check app tests

      - name: Black
        run: poetry run black --check app tests

      - name: Mypy
        run: poetry run mypy app

      - name: Pytest
        run: |
          mkdir -p test-results
          poetry run pytest tests/ -q --durations=25 --junitxml=test-results/pytest.xml

      - name: Verify inactive Edge database identity lifecycle
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          test -n "$POSTGRES_SERVICE_ID"
          docker cp \
            ../infra/postgres/manage-edge-cash-identity.sql \
            "$POSTGRES_SERVICE_ID:/tmp/manage-edge-cash-identity.sql"
          docker cp \
            ../infra/postgres/manage-edge-cash-identity.sh \
            "$POSTGRES_SERVICE_ID:/tmp/manage-edge-cash-identity.sh"
          docker cp \
            ../scripts/test-edge-cash-identity.sh \
            "$POSTGRES_SERVICE_ID:/tmp/test-edge-cash-identity.sh"
          docker exec -i \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=aurum_test \
            -e POSTGRES_PASSWORD_FILE=/tmp/aurum-postgres-password \
            -e AURUM_APP_PASSWORD_FILE=/tmp/aurum-app-password \
            -e AURUM_SUPPORT_PASSWORD_FILE=/tmp/aurum-support-password \
            -e AURUM_MIGRATOR_PASSWORD_FILE=/tmp/aurum-migrator-password \
            -e AURUM_MAILER_PASSWORD_FILE=/tmp/aurum-mailer-password \
            -e AURUM_BILLING_WORKER_PASSWORD_FILE=/tmp/aurum-billing-worker-password \
            -e AURUM_BACKUP_PASSWORD_FILE=/tmp/aurum-backup-password \
            -e AURUM_PITR_PASSWORD_FILE=/tmp/aurum-pitr-password \
            -e EDGE_IDENTITY_SCRIPT=/tmp/manage-edge-cash-identity.sh \
            -e ROLE_BOOTSTRAP_SCRIPT=/tmp/bootstrap-roles.sh \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e AURUM_DISPOSABLE_DB_CONFIRM=destroy-this-database \
            "$POSTGRES_SERVICE_ID" \
            sh /tmp/test-edge-cash-identity.sh

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-results-${{ github.run_attempt }}
          path: backend/test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Stop MinIO
        if: always()
        run: |
          if docker container inspect aurum-ci-minio > /dev/null 2>&1; then
            docker rm --force aurum-ci-minio
          fi

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9.12.0

      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: |
          mkdir -p test-results
          pnpm exec vitest run tests \
            --reporter=dot \
            --reporter=junit \
            --outputFile.junit=test-results/vitest.xml

      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-test-results-${{ github.run_attempt }}
          path: frontend/test-results/vitest.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Production build
        # TypeScript was checked above; avoid running tsc twice in the same job.
        run: pnpm build:assets

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.3.4

      - name: Cache Poetry environment
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: backend/.venv
          key: ${{ runner.os }}-python-3.12-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-python-3.12-poetry-

      - name: Install locked Python dependencies
        working-directory: backend
        run: |
          poetry check --lock
          poetry install --no-root --with dev --sync
          # pip is build tooling, not a Poetry project dependency. Pin the
          # audited environment to the current patched release for PYSEC-2026-3721.
          poetry run python -m pip install --disable-pip-version-check --upgrade pip==26.2.1

      - name: Audit Python dependencies
        working-directory: backend
        shell: bash
        run: |
          report=.pip-audit.json
          trap 'rm -f -- "$report"' EXIT

          for delay in 0 5 15; do
            sleep "$delay"
            : > "$report"

            poetry run pip-audit \
              --local \
              --format=json \
              --output="$report" \
              --progress-spinner=off \
              --desc=off \
              --aliases=on \
              --timeout=20 || true

            if [ -s "$report" ]; then
              python - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              dependencies = json.load(stream)["dependencies"]

          skipped = [item for item in dependencies if item.get("skip_reason")]
          vulnerabilities = [
              (item["name"], vulnerability["id"], vulnerability.get("fix_versions", []))
              for item in dependencies
              for vulnerability in item.get("vulns", [])
          ]

          for item in skipped:
              print(f"SKIPPED {item['name']}: {item['skip_reason']}")
          for name, vulnerability_id, fixes in vulnerabilities:
              print(f"VULNERABLE {name}: {vulnerability_id}; fixes={fixes}")

          raise SystemExit(1 if skipped or vulnerabilities else 0)
          PY
              exit 0
            fi
          done

          echo "::error title=Python audit unavailable::No complete report after 3 attempts"
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9.12.0

      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked JavaScript dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Audit JavaScript dependencies
        working-directory: frontend
        run: pnpm audit --audit-level high

  e2e:
    name: Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
      COMPOSE_FILE: docker-compose.e2e.yml
      COMPOSE_PROJECT_NAME: aurum-e2e-ci
      E2E_API_URL: http://localhost:18000/api/v1
      E2E_BASE_URL: http://localhost:15173
      E2E_POSTGRES_DB: aurum
      E2E_RETRIES: ${{ github.event_name == 'schedule' && '0' || '1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9.12.0

      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        working-directory: frontend
        shell: bash
        run: pnpm exec playwright --version | sed 's/^Version /version=/' >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Start isolated application stack
        shell: bash
        run: |
          docker compose up -d --build postgres redis minio
          docker compose run --rm db-role-bootstrap
          docker compose run --rm --build migrate
          docker compose up -d --build backend celery-worker billing-worker frontend
          docker compose ps
          echo "E2E_POSTGRES_CONTAINER=$(docker compose ps --quiet postgres)" >> "$GITHUB_ENV"
          echo "E2E_REDIS_CONTAINER=$(docker compose ps --quiet redis)" >> "$GITHUB_ENV"

      - name: Migrate and seed disposable E2E database
        run: |
          docker compose exec -T -e AURUM_E2E_SEED=1 backend python -m app.seed_e2e
          docker compose exec -T backend python -m app.seed_demo

      - name: Restart frontend and wait for HTTP readiness
        shell: bash
        run: |
          docker compose restart frontend

          wait_for_url() {
            local name="$1"
            local url="$2"
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error "$url" > /dev/null; then
                echo "$name is ready"
                return 0
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "$name did not become ready: $url"
                return 1
              fi
              sleep 2
            done
          }

          wait_for_url "Backend" "http://localhost:18000/healthz"
          wait_for_url "Frontend" "http://localhost:15173"

      - name: Run Playwright E2E
        working-directory: frontend
        run: pnpm e2e

      - name: Show service logs on failure
        if: failure()
        run: >-
          docker compose logs --no-color --tail=250
          postgres redis minio backend celery-worker billing-worker frontend

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts-${{ github.run_attempt }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop isolated application stack
        if: always()
        run: docker compose down -v --remove-orphans

  production-containers:
    name: Production container gate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate production Compose model
        shell: bash
        run: |
          docker compose \
            --env-file .env.production.example \
            --file docker-compose.production.yml \
            --profile maintenance \
            config --quiet

          docker compose \
            --env-file .env.production.example \
            --file docker-compose.production.yml \
            --file docker-compose.recovery.yml \
            --profile backup \
            --profile restore-drill \
            --profile offsite \
            --profile offsite-test \
            config --quiet

          docker compose \
            --env-file .env.edge-shadow.example \
            --file docker-compose.edge-shadow.hardened.yml \
            config --format json > "$RUNNER_TEMP/edge-shadow-compose.json"

          python - "$RUNNER_TEMP/edge-shadow-compose.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              edge = json.load(source)

          assert not any(service.get("ports") for service in edge["services"].values())
          assert edge["networks"]["edge-data"]["internal"] is True
          worker = edge["services"]["edge-worker"]
          assert worker["read_only"] is True
          assert worker["cap_drop"] == ["ALL"]
          assert worker["environment"]["EDGE_WRITER_ACTIVATION_ENABLED"] == "false"
          assert worker["environment"]["EDGE_WRITER_READINESS_ENABLED"] == "false"
          assert worker["environment"]["EDGE_SYNC_CLOUD_URL"].startswith("https://")
          assert not worker.get("volumes"), "Edge worker must not mount source code"
          assert edge["services"]["edge-migrate"]["build"]["dockerfile"] == (
              "Dockerfile.production"
          )
          PY

          docker compose \
            --env-file .env.production.example \
            --file docker-compose.production.yml \
            --profile maintenance \
            config --format json > "$RUNNER_TEMP/production-compose.json"

          docker compose \
            --env-file .env.production.example \
            --file docker-compose.production.yml \
            --file docker-compose.recovery.yml \
            --profile backup \
            --profile restore-drill \
            --profile offsite \
            --profile offsite-test \
            config --format json > "$RUNNER_TEMP/recovery-compose.json"

          docker compose \
            --env-file .env.example \
            --file docker-compose.yml \
            --profile maintenance \
            config --format json > "$RUNNER_TEMP/development-compose.json"

          python - \
            "$RUNNER_TEMP/production-compose.json" \
            "$RUNNER_TEMP/development-compose.json" \
            "$RUNNER_TEMP/recovery-compose.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              model = json.load(source)
          with open(sys.argv[2], encoding="utf-8") as source:
              development_model = json.load(source)
          with open(sys.argv[3], encoding="utf-8") as source:
              recovery_model = json.load(source)

          published = sorted(
              name for name, service in model["services"].items() if service.get("ports")
          )
          assert published == ["gateway"], f"unexpected published services: {published}"

          for name in ("app", "data", "monitoring"):
              assert model["networks"][name]["internal"] is True, (
                  f"{name} network must be internal"
              )

          hardened = (
              "backend", "celery-worker", "billing-worker", "celery-beat",
              "platform-mailer", "gateway"
          )
          for name in hardened:
              service = model["services"][name]
              assert service["read_only"] is True, (
                  f"{name} root filesystem must be read-only"
              )
              assert service["cap_drop"] == ["ALL"], f"{name} must drop all capabilities"
              assert "no-new-privileges:true" in service["security_opt"], (
                  f"{name} must prevent privilege escalation"
              )

          backend_command = " ".join(model["services"]["backend"]["command"])
          assert "--reload" not in backend_command, "backend Compose command enables reload"

          runtime_services = ("backend", "celery-worker", "celery-beat")
          forbidden_runtime_environment = {
              "DATABASE_URL_MIGRATION",
              "POSTGRES_PASSWORD",
              "AURUM_APP_PASSWORD",
              "AURUM_SUPPORT_PASSWORD",
              "AURUM_MIGRATOR_PASSWORD",
              "AURUM_MAILER_PASSWORD",
              "AURUM_BILLING_WORKER_PASSWORD",
              "AURUM_BACKUP_PASSWORD",
              "AURUM_PITR_PASSWORD",
              "AURUM_OFFSITE_ACCESS_KEY",
              "AURUM_OFFSITE_SECRET_KEY",
              "TEST_DATABASE_URL_APP",
              "TEST_DATABASE_URL_SUPPORT",
              "TEST_DATABASE_URL_MIGRATION",
              "TEST_DATABASE_URL_MAILER",
              "TEST_DATABASE_URL_BILLING_WORKER",
              "MINIO_ROOT_USER",
              "MINIO_ROOT_PASSWORD",
              "DATABASE_URL_BACKUP",
              "DATABASE_URL_PITR",
          }
          for compose_model in (model, development_model):
              for name in runtime_services:
                  environment = set(
                      compose_model["services"][name].get("environment", {})
                  )
                  leaked = environment & forbidden_runtime_environment
                  assert not leaked, (
                      f"{name} receives maintenance environment: {sorted(leaked)}"
                  )
              billing_environment = set(
                  compose_model["services"]["billing-worker"].get("environment", {})
              )
              forbidden_billing_environment = {
                  "DATABASE_URL_APP",
                  "DATABASE_URL_SUPPORT",
                  "DATABASE_URL_MIGRATION",
                  "DATABASE_URL_MAILER",
                  "JWT_SECRET",
                  "MFA_ENCRYPTION_KEY",
                  "MINIO_ACCESS_KEY",
                  "MINIO_SECRET_KEY",
                  "EMAIL_PASSWORD",
              }
              leaked = billing_environment & forbidden_billing_environment
              assert not leaked, (
                  "billing-worker receives unrelated credentials: "
                  f"{sorted(leaked)}"
              )

          forbidden_runtime_secrets = {
              "postgres_password",
              "aurum_migrator_password",
              "database_url_migration",
          }
          for name in runtime_services:
              mounted = {
                  secret["source"] for secret in model["services"][name].get("secrets", [])
              }
              assert not mounted & forbidden_runtime_secrets, (
                  f"{name} receives maintenance secrets: "
                  f"{sorted(mounted & forbidden_runtime_secrets)}"
              )

          migrate_secrets = {
              secret["source"]
              for secret in model["services"]["migrate"].get("secrets", [])
          }
          assert migrate_secrets == {
              "database_url_support",
              "database_url_migration",
          }, f"unexpected migrate secrets: {sorted(migrate_secrets)}"

          bootstrap_secrets = {
              secret["source"]
              for secret in model["services"]["db-role-bootstrap"].get("secrets", [])
          }
          assert bootstrap_secrets == {
              "postgres_password",
              "aurum_app_password",
              "aurum_support_password",
              "aurum_migrator_password",
              "aurum_mailer_password",
              "aurum_billing_worker_password",
              "aurum_backup_password",
              "aurum_pitr_password",
          }, f"unexpected bootstrap secrets: {sorted(bootstrap_secrets)}"

          postgres_command = " ".join(model["services"]["postgres"]["command"])
          assert "archive_mode=on" in postgres_command
          assert "archive_timeout=60s" in postgres_command
          assert "archive-wal.sh" in postgres_command
          postgres_targets = {
              volume["target"] for volume in model["services"]["postgres"]["volumes"]
          }
          assert "/wal-archive" in postgres_targets

          assert recovery_model["networks"]["recovery"]["internal"] is True
          assert not any(
              service.get("ports")
              for service in recovery_model["services"].values()
              if service.get("profiles")
          )
          offsite = recovery_model["services"]["offsite-sync"]
          assert {
              secret["source"] for secret in offsite["secrets"]
          } == {"aurum_offsite_access_key", "aurum_offsite_secret_key"}
          assert set(offsite["networks"]) == {"backup-egress"}
          assert all(
              volume.get("read_only") is True
              for volume in offsite["volumes"]
              if volume["target"] == "/repository"
          )
          pitr_secrets = {
              secret["source"]
              for secret in recovery_model["services"]["pitr-basebackup"]["secrets"]
          }
          assert pitr_secrets == {"database_url_pitr", "restic_password"}
          wal_mount = next(
              volume
              for volume in recovery_model["services"]["wal-snapshot"]["volumes"]
              if volume["target"] == "/wal-archive"
          )
          assert wal_mount["read_only"] is True

          assert model["services"]["redis"]["environment"]["AURUM_REDIS_MAXMEMORY"]
          assert model["services"]["redis"]["logging"]["driver"] == "local"
          for name, service in model["services"].items():
              assert service.get("mem_limit"), f"{name} has no memory limit"
              assert service.get("cpus"), f"{name} has no CPU limit"

          billing_worker_secrets = {
              secret["source"]
              for secret in model["services"]["billing-worker"].get("secrets", [])
          }
          assert billing_worker_secrets == {
              "database_url_billing_worker",
              "redis_url",
          }, f"unexpected billing worker secrets: {sorted(billing_worker_secrets)}"
          assert set(model["services"]["billing-worker"]["networks"]) == {"data"}

          mailer_secrets = {
              secret["source"]
              for secret in model["services"]["platform-mailer"].get("secrets", [])
          }
          assert mailer_secrets == {
              "database_url_mailer",
              "redis_url",
              "email_outbox_encryption_key",
              "email_outbox_previous_keys",
              "email_password",
          }, f"unexpected mailer secrets: {sorted(mailer_secrets)}"
          assert set(model["services"]["platform-mailer"]["networks"]) == {
              "data",
              "mailer-egress",
          }
          PY

      - name: Check production Dockerfiles
        run: |
          docker build --check --file backend/Dockerfile.production backend
          docker build --check --file frontend/Dockerfile.production frontend
          docker build --check --file infra/backup/Dockerfile infra/backup

      - name: Set up cached production builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build production backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          file: backend/Dockerfile.production
          pull: true
          load: true
          tags: aurum-backend:ci
          cache-from: type=gha,scope=aurum-production-backend
          cache-to: type=gha,mode=max,scope=aurum-production-backend,ignore-error=true

      - name: Build production gateway
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend
          file: frontend/Dockerfile.production
          pull: true
          load: true
          tags: aurum-gateway:ci
          cache-from: type=gha,scope=aurum-production-gateway
          cache-to: type=gha,mode=max,scope=aurum-production-gateway,ignore-error=true

      - name: Build recovery tooling
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: infra/backup
          file: infra/backup/Dockerfile
          pull: true
          load: true
          tags: |
            aurum-backup:ci
            aurum-pharma-backup:ci
          cache-from: type=gha,scope=aurum-production-backup
          cache-to: type=gha,mode=max,scope=aurum-production-backup,ignore-error=true

      - name: Test encrypted backup and isolated restore
        run: sh ./scripts/test-recovery-tooling.sh

      - name: Scan repository for committed secrets
        run: >-
          docker run --rm
          --volume "$PWD:/workspace:ro"
          --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/"
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          fs --scanners secret --exit-code 1 /workspace

      - name: Scan production Dockerfiles for high-risk configuration
        shell: bash
        run: |
          for target in \
            /workspace/backend/Dockerfile.production \
            /workspace/frontend/Dockerfile.production \
            /workspace/infra/backup/Dockerfile; do
            docker run --rm \
              --volume "$PWD:/workspace:ro" \
              --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/" \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              config --severity HIGH,CRITICAL --exit-code 1 "$target"
          done

      - name: Scan production images for fixable vulnerabilities
        shell: bash
        run: |
          for image in aurum-backend:ci aurum-gateway:ci aurum-backup:ci; do
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/" \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$image"
          done

      - name: Generate CycloneDX SBOMs
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          for component in backend gateway backup; do
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$RUNNER_TEMP/sbom:/reports" \
              --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/" \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --format cyclonedx --output "/reports/$component.cdx.json" \
              "aurum-$component:ci"
            test -s "$RUNNER_TEMP/sbom/$component.cdx.json"
          done

      - name: Upload production SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-sbom
          path: ${{ runner.temp }}/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate Prometheus configuration and alert rules
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/prometheus-secrets"
          printf '%064d' 0 > "$RUNNER_TEMP/prometheus-secrets/METRICS_TOKEN"
          docker run --rm \
            --entrypoint /bin/promtool \
            --volume "$PWD/infra/prometheus:/etc/prometheus:ro" \
            --volume "$RUNNER_TEMP/prometheus-secrets:/run/secrets:ro" \
            prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893 \
            check config /etc/prometheus/prometheus.production.yml

      - name: Verify hardened image metadata
        shell: bash
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' aurum-backend:ci)" = "10001:10001"
          test "$(docker image inspect --format '{{.Config.User}}' aurum-gateway:ci)" = "10001:10001"

          backend_cmd="$(docker image inspect --format '{{json .Config.Cmd}}' aurum-backend:ci)"
          if grep -q -- '--reload' <<<"$backend_cmd"; then
            echo "::error title=Unsafe production command::Backend image contains --reload"
            exit 1
          fi

      - name: Validate production Caddy configuration
        run: >-
          docker run --rm
          --env AURUM_DOMAIN=pharmacy.example.com
          --env AURUM_ACME_EMAIL=ops@example.com
          --entrypoint caddy
          aurum-gateway:ci
          validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Smoke-test hardened gateway runtime
        shell: bash
        run: |
          container=aurum-gateway-runtime-check
          trap 'docker rm --force --volumes "$container" >/dev/null 2>&1 || true' EXIT

          docker run --detach \
            --name "$container" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env AURUM_DOMAIN=localhost \
            --env AURUM_ACME_EMAIL=ops@example.com \
            --volume /data \
            --volume /config \
            aurum-gateway:ci

          for attempt in {1..15}; do
            if docker exec "$container" \
              wget --quiet --spider http://127.0.0.1:9080/healthz; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$container"
          exit 1

  ci-gate:
    name: CI gate
    if: always()
    needs: [verification-tooling, backend, frontend, dependency-audit, e2e, production-containers]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify all required jobs
        shell: bash
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          VERIFICATION_TOOLING_RESULT: ${{ needs['verification-tooling'].result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          AUDIT_RESULT: ${{ needs['dependency-audit'].result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          PRODUCTION_CONTAINERS_RESULT: ${{ needs['production-containers'].result }}
        run: |
          failed=0
          for result in \
            "verification-tooling:$VERIFICATION_TOOLING_RESULT" \
            "backend:$BACKEND_RESULT" \
            "frontend:$FRONTEND_RESULT" \
            "dependency-audit:$AUDIT_RESULT" \
            "e2e:$E2E_RESULT" \
            "production-containers:$PRODUCTION_CONTAINERS_RESULT"; do
            name="${result%%:*}"
            status="${result#*:}"
            printf '%s: %s\n' "$name" "$status" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$status" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
