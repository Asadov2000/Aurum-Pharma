version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Dushanbe
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Dushanbe
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Dushanbe
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Dushanbe
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Dushanbe
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Dushanbe
    open-pull-requests-limit: 3
