# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2

####################################################################################################
# Aurum Pharma WinUI host prerequisites.
#
# Intended effect when applied with `winget configure`:
# - verify supported Windows build;
# - enable Developer Mode;
# - install or update Visual Studio Community;
# - install C# desktop, UWP, and Windows App SDK components needed for WinUI 3.
#
# Do not apply this from automation without an explicit user decision: it changes the host machine.
####################################################################################################
properties:
  assertions:
    - resource: Microsoft.Windows.Developer/OsVersion
      directives:
        description: Verify minimum Windows version for WinUI 3 development
        allowPrerelease: true
      settings:
        MinVersion: '10.0.17763'
  resources:
    - resource: Microsoft.Windows.Settings/WindowsSettings
      directives:
        description: Enable Developer Mode
        securityContext: elevated
        allowPrerelease: true
      settings:
        DeveloperMode: true
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Visual Studio
      directives:
        description: Install Visual Studio Community
        securityContext: elevated
      settings:
        id: Microsoft.VisualStudio.Community
        source: winget
    - resource: Microsoft.VisualStudio.DSC/VSComponents
      id: Workloads ManagedDesktop
      dependsOn:
        - Visual Studio
      directives:
        description: Install required Visual Studio workloads for WinUI 3 C#
        allowPrerelease: true
        securityContext: elevated
      settings:
        productId: Microsoft.VisualStudio.Product.Community
        channelId: VisualStudio.18.Release
        components:
          - Microsoft.VisualStudio.Workload.ManagedDesktop
          - Microsoft.VisualStudio.Workload.Universal
          - Microsoft.VisualStudio.ComponentGroup.WindowsAppSDK.Cs
  configurationVersion: 0.2.0
