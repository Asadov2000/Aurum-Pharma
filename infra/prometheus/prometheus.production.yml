global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.production.yml

scrape_configs:
  - job_name: aurum-backend
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/METRICS_TOKEN
    static_configs:
      - targets: ["backend:8000"]

  - job_name: aurum-recovery
    static_configs:
      - targets: ["aurum-recovery-exporter:9100"]
